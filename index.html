<style>
/* VOICE: a calm personal money ledger, plain and exact
   IDEA: the daily cash book you keep in Excel, read back as answers
   PICTURE: month-by-month bars of morning + evening earnings against spending
   COLOUR and TYPE: white, ink, signal green band for the headline figure; Space Grotesk + Inter
   LAYOUT: headline band, tabs, then one main chart and ruled tables */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#07130d);--card:light-dark(#ffffff,#0c1d14);--ink:light-dark(#0b0b10,#eef5f1);--muted:light-dark(#5a5f6b,#9fb3a8);--line:light-dark(#e4e7ea,#1f3a2c);--mist:light-dark(#eafaf2,#10271b);--band:#00a862;--bandInk:#03130a;--m:light-dark(#257de0,#338ced);--e:light-dark(#00b894,#00a888);--x:light-dark(#d92d2d,#f06363);--up:light-dark(#007a45,#4be09a);--down:light-dark(#b8400c,#ff9466);--b:light-dark(#6a4ce2,#9887ef);--u:light-dark(#8b93a1,#7d8696)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.num{font-family:'Space Grotesk',Inter,sans-serif}
h2{font-size:20px;margin:0 0 12px;line-height:1.2}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:22px;display:flex;gap:10px;align-items:center}
.brand .note{font:500 13px Inter,sans-serif}.sync-ok{color:var(--up)}.sync-err{color:var(--down)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--m);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1}.navrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}#backBtn{flex:none;min-height:40px;padding:0 12px}
nav.tabs a{flex:none;padding:12px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--ink);border-color:var(--band)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:16px}
select,input[type=search]{min-height:44px;font:16px Inter,sans-serif;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hero{background:var(--band);color:var(--bandInk);border-radius:16px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;align-items:center}
.hero .hk{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hero .hk>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.12);min-width:0}
.hero .hk>div b{font-size:clamp(17px,4.6vw,22px)}
.hero .hk>div>span{display:block;margin-bottom:4px}.hero .hk>div>b.exred,.hero .hk>div>b.svgrn,.hero .hk>div>b.mfhl{display:inline-block;width:auto}
.hero.ovhero{align-items:start}
.ovhero .hk{gap:8px}.ovhero .hk>div{padding:8px 10px;border-radius:12px}.ovhero .hk>div>span{font-size:11.5px;margin-bottom:2px}.ovhero .hk>div b{font-size:clamp(15px,4vw,18px)}
.ovhero .ask{padding:10px 12px}
.ovr{display:flex;flex-direction:column;gap:12px;min-width:0}
.ask{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.askh{font-weight:800;font-size:15px;margin-bottom:8px}
#askF,#askF2{display:flex;gap:8px}#askF .in,#askF2 .in{flex:1;min-width:0;min-height:42px}#askF .btn,#askF2 .btn{min-height:42px;padding:0 16px}
.askchips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.askchips::-webkit-scrollbar{display:none}
.hero .askchips .chip{flex:none;font-size:12px;padding:6px 10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:999px;cursor:pointer;white-space:nowrap}
a.askgo{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;font-weight:800;cursor:pointer}a.askgo:hover{text-decoration-style:solid}
#askA:not(:empty),#askA2:not(:empty){margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2)}
.askq{margin:0 0 4px;font-size:12px;opacity:.75}.askr{margin:0 0 4px;font-size:15px;line-height:1.45}.askr b{font-size:17px}.askl{margin:2px 0;font-size:13px;opacity:.92;line-height:1.45}
.ovl{display:flex;flex-direction:column;gap:12px;min-width:0}.ovnet span{font-size:13px;font-weight:600;display:block}.ovnet b{display:block;font:700 22px 'Space Grotesk',sans-serif;white-space:nowrap}
.ovc{border-top:1px solid currentColor;border-color:rgba(255,255,255,.18);padding-top:8px}.ovh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700}
.ovv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}.ovv b{font:700 17px 'Space Grotesk',sans-serif}.ovv small{font-size:11.5px;opacity:.8}
.hero select.ovtf{width:auto!important;min-height:28px!important;padding:2px 8px!important;font-size:12px!important;border-radius:8px!important;background:rgba(255,255,255,.16)!important;color:inherit!important;border:1px solid rgba(255,255,255,.35)!important}
.hero select.ovtf option{color:#111;background:#fff}
.hero .big{font:700 clamp(36px,6vw,56px)/1.05 'Space Grotesk',sans-serif;white-space:nowrap}
.hero .lbl{font-size:14px;font-weight:600}
.hk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.hk b{display:block;font:700 22px 'Space Grotesk',sans-serif;white-space:nowrap}
.hk span{font-size:13px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.kpi span{font-size:13px;color:var(--muted)}.kpi b{display:block;font:700 24px 'Space Grotesk',sans-serif;white-space:nowrap}.kpi small{font-size:13px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stackv{display:flex;flex-direction:column;gap:16px;padding-bottom:48px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;display:none;white-space:nowrap;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.upc{color:var(--up);font-weight:600}.exc{color:var(--x)!important}.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;font-size:14px}.mrow .t{grid-column:1/-1;height:10px;background:var(--mist);border-radius:5px;overflow:hidden}.mrow .t i{display:block;height:100%;border-radius:5px}tr.offrow{background:light-dark(#fde4e4,#3b1416)}tr.offrow td{color:var(--x)}tr.offrow td b{color:var(--x)}.lnk{background:none;border:0;padding:4px 0;min-height:32px;color:var(--m);font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}.items{font-size:13px;line-height:1.5}.btn:disabled{opacity:.4;cursor:default}td.heat{background:color-mix(in srgb,var(--m) calc(var(--a)*100%),transparent)}.exred{color:#b91c1c;background:#fff;border-radius:6px;padding:0 6px;display:inline-block}.dnc{color:var(--down);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px;width:100%;background:none;border:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer;min-height:36px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:10px;background:var(--mist);border-radius:5px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--x);border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--mist);color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:7px;background:none;color:var(--muted);font:600 14px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:clamp(24px,5vw,56px);text-align:center;background:var(--mist)}
.drop.over{border-color:var(--band)}
.msg{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--mist);margin-top:12px}
.note{font-size:13px;color:var(--muted)}
.in{min-height:44px;font:16px Inter,sans-serif;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px}.frow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 150px}
.tog{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600;min-height:44px}.tog input{width:22px;height:22px;accent-color:var(--band)}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 44px;gap:8px;margin-bottom:8px}
.xrow input,.xrow select{min-height:44px;font:16px Inter,sans-serif;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.xrow .xdel{padding:0;justify-content:center;font-size:20px}
input:disabled{opacity:.45}
@media(max-width:600px){.xrow{grid-template-columns:1fr 1fr 44px}.xrow .xi{grid-column:1/-1}}
pre,.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}}

*{font-family:var(--font),system-ui,sans-serif!important}
.hero .big,.kpi b,.hk b,h1,h2{font-family:var(--num,var(--font)),system-ui,sans-serif!important}
html{background:var(--bg)}
body{background:transparent;color:var(--ink);min-height:100vh}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{width:420px;height:420px;background:var(--glow1);opacity:var(--glow1o);top:-160px;left:-120px}
body::after{width:360px;height:360px;background:var(--glow2);opacity:var(--glow2o);bottom:-140px;right:-140px}
h1,h2{letter-spacing:-.02em;font-weight:800}
.card,.kpi{background:var(--glass);border:1px solid var(--glassB);border-radius:var(--radius);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.kpi b,.hk b{font-weight:800}
.hero{background:var(--hero);border:var(--heroB);color:var(--heroInk);border-radius:calc(var(--radius) + 4px)}
.hero .lbl,.hk span{color:var(--heroSub)}
.hero .big{font-weight:800!important;letter-spacing:-.03em}
.hk b.svgrn{display:inline-block;color:#06381f;background:#86efac;border-radius:8px;padding:0 8px}.hk b.mfhl{display:inline-block;color:#1e1b4b;background:#c7d2fe;border-radius:8px;padding:0 8px}
.exred,.hk b.exred{display:inline-block;color:var(--exInk);background:var(--exBg);border-radius:8px;padding:0 8px}
.btn{background:var(--glass);border:1px solid var(--btnB);color:var(--ink);border-radius:14px}
.btn.pri{background:var(--pri);border:0;color:var(--priInk);box-shadow:var(--priShadow)}
select,input[type=search],.in,.xrow input,.xrow select{background:var(--in)!important;border:1px solid var(--inB)!important;color:var(--ink)!important;border-radius:14px!important}
select option{background:var(--opt);color:var(--ink)}
input::placeholder{color:var(--ph)}

/* Fingerprint / face unlock. The PIN still locks the data. Here the PIN is kept sealed on this device

window.BIO=(()=>{
  const te=new TextEncoder(),td=new TextDecoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
  const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bio-keys',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

  async function deviceKey(app,make){let k=await idbDo('readonly',s=>s.get(app));
    if(!k&&make){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await idbDo('readwrite',s=>s.put(k,app))}
    if(!k)throw new Error('nokey');return k}
  async function prfKey(secret){const base=await crypto.subtle.importKey('raw',secret,'HKDF',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('bio-unlock'),info:new Uint8Array()},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
  async function assert(id,salt){const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:ub64(id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000,extensions:salt?{prf:{eval:{first:salt}}}:{}}});
    const r=a.getClientExtensionResults&&a.getClientExtensionResults().prf;return r&&r.results&&r.results.first}
  const api={
    async supported(){try{return !!(window.PublicKeyCredential&&window.isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}},
    on(app){try{return !!JSON.parse(localStorage.getItem(K(app)))}catch(e){return false}},
    async enable(app,label,pin){const salt=rnd(32);
      const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:label},user:{id:rnd(16),name:label+' unlock',displayName:label},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000,extensions:{prf:{eval:{first:salt}}}}});

      let secret=ext.results&&ext.results.first;

      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(pin));

  };

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let p=buf.byteLength-22;
  while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;

  const n=dv.getUint16(p+10,true);let o=dv.getUint32(p+16,true);const ents={};
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true);
    ents[td.decode(u8.subarray(o+46,o+46+nl))]={m:dv.getUint16(o+10,true),cs:dv.getUint32(o+20,true),lo:dv.getUint32(o+42,true)};
    o+=46+nl+el+cl;
  }
  return async name=>{const f=ents[name];if(!f)return null;
    const s0=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.slice(s0,s0+f.cs);
    if(f.m===0)return td.decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();};
}

function readCsv(text,name){

  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}

    const ic=r.findIndex(c=>/^\s*invest\s*$/i.test(String(c??'')));if(ic<1)continue;
    const rc=r.findIndex(c=>/^\s*roi\s*$/i.test(String(c??'')));
    for(let k=i+1;k<Math.min(rows.length,i+15);k++){const q=rows[k]||[];const name=String(q[ic-1]??'').trim();

}

      <div class="scroll"><table style="min-width:520px"><thead><tr><th>Month</th><th class="r">Credit: month sheet</th><th class="r">Credit: overview</th><th></th><th class="r">Expenses: month sheet</th><th class="r">Expenses: overview</th><th></th></tr></thead><tbody>${yms.map(ym=>{const a=excelMonth(ym)||{c:0,x:0},b=r.ovXl[ym];return`<tr><td>${ymLabel(ym)}</td><td class="r">${inr(a.c)}</td><td class="r">${inr(b.c)}</td><td>${ok(a.c,b.c)}</td><td class="r">${inr(a.x)}</td><td class="r">${inr(b.x)}</td><td>${ok(a.x,b.x)}</td></tr>`}).join('')}</tbody></table></div>`;
    }else h+=`<p class="note" style="margin:8px 0 0">${r.type==='skip'?'Not used by the app.':'Nothing could be read from this sheet as '+esc(typeName[r.type]||'')+'.'}</p>`;
    if(can&&DB.map[r.name])h+=`<button class="btn" type="button" data-reset="${n}" style="margin-top:10px">Undo my changes for this sheet</button>`;
    return h+'</section>'};
  const nApp=Object.keys(DB.manual).length;
  let h=`<section class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><h2 style="margin:0">Import check</h2><button class="btn" type="button" id="impTog">${impHidden()?'Show import details':'Hide import details'}</button></div>${impHidden()?`<p style="margin:8px 0 0" class="note">${impSummary()} Details are hidden.</p>`:`<p style="margin:0">Each sheet’s totals are compared with the TOTAL CREDIT and TOTAL EXPENCE figures in that sheet, and with your yearly overview. If something is off, pick the right column and everything updates.${can?'':' <b>To change columns, upload your file again:</b> the app reads your Excel file and does not keep it.'}</p>${nApp?`<p class="note" style="margin:8px 0 0">${nApp} day${nApp>1?'s':''} added on the Add entry page replace the same days from Excel.</p>`:''}`}</section>`;
  if(!impHidden())h+=DB.demo?'<section class="card"><p style="margin:0">You are looking at sample data. Upload your Excel file to check it here.</p></section>':reps.length?reps.map(card).join(''):'<section class="card"><p style="margin:0">No file read yet.</p></section>';
  h+=`<section class="card"><h2>Security</h2>
  <ul style="margin:0 0 12px;padding-left:18px">
  <li>Your Excel file is read on this device and is never uploaded anywhere. Only the numbers are kept, never the file itself.</li>
  <li>The numbers are saved on this device, encrypted with your PIN (AES-256).</li>
  <li>If you turn on sync, only an encrypted copy goes to your own GitHub account. Without your PIN it is unreadable, even to GitHub.</li>
  <li>The app locks itself after 5 minutes away, and after 5 wrong PINs it makes you wait longer each time.</li>
  <li>If you forget your PIN, the saved data cannot be opened by anyone, including you. Clear it and upload your Excel again.</li></ul>
  ${!canCrypt?'<p class="dnc">This browser can’t encrypt, so nothing is saved.</p>':KEYOBJ?`<p style="margin:0"><b class="upc">✓ Saved and encrypted with your PIN.</b></p><p style="margin:12px 0 0;font-weight:600">Change PIN</p>${pinForm('cp','Change PIN')}<div id="bioBox" hidden style="margin-top:14px"><p style="margin:0;font-weight:600">Fingerprint / face unlock</p><p class="note" style="margin:4px 0 8px">Open the app with your fingerprint instead of typing the PIN. Your PIN still works. Turn this on separately on your phone and laptop.</p><div class="acts"><button class="btn pri" type="button" id="bioOn">Turn on fingerprint unlock</button><button class="btn" type="button" id="bioOff">Turn off fingerprint unlock</button></div><p class="note" id="bioM" style="margin:8px 0 0"></p></div><div class="acts" style="margin-top:12px"><button class="btn" type="button" id="lk">Lock now</button><button class="btn" type="button" id="er">Clear all data</button></div>`:DB.demo?'<p class="note" style="margin:0">Sample data is never saved.</p>':hasData()?`<p style="margin:0" class="dnc">Not saved yet: set a PIN to keep this data.</p>${pinForm('pf2','Save with PIN')}<div class="acts" style="margin-top:12px"><button class="btn" type="button" id="er">Clear all data</button></div>`:`<p style="margin:0">Set a PIN to save your data on this device and to turn on sync.</p>${pinForm('pf2','Set PIN')}`}</section>`;
  h+=`<section class="card"><h2>App version</h2><p style="margin:0 0 10px">You are using version <b>${esc(APP_VERSION||'—')}</b>.</p><div class="acts"><button class="btn" type="button" id="chkUpd">Check for updates</button></div><p class="note" id="chkUpdM" style="margin:8px 0 0"></p></section>`;
  $('#view').innerHTML=syncSection()+backupSection()+h;bindSync();bindBackup();
  if($('#bioBox'))BIO.supported().then(ok=>{const bx=$('#bioBox');if(!bx||!ok)return;bx.hidden=false;const on=BIO.on('moneydiary');$('#bioOn').hidden=on;$('#bioOff').hidden=!on;$('#bioM').textContent=on?'✓ On for this device.':'';
    $('#bioOn').onclick=async()=>{try{await BIO.enable('moneydiary','Money Diary',PINMEM);render()}catch(e){$('#bioM').textContent=BIO.why(e)}};
    $('#bioOff').onclick=async()=>{await BIO.off('moneydiary');render()}});
  {const c=$('#chkUpd');if(c)c.onclick=async()=>{const m=$('#chkUpdM');m.className='note';m.textContent='Checking…';const v=await checkUpdate();m.textContent=!v?'Couldn’t check right now (no internet?).':v!==APP_VERSION?'A new version ('+v+') is ready: tap “Update now” at the top.':'You have the latest version.'}}
  {const t=$('#impTog');if(t)t.onclick=()=>{try{localStorage.setItem('md.hideImport',impHidden()?'0':'1')}catch(e){}render()}}
  bindPinForm('cp',()=>{flash('PIN changed.');render()});bindPinForm('pf2',()=>{flash('Saved and encrypted with your PIN.');render()});
  const lk=$('#lk');if(lk)lk.onclick=lockNow;confirm2($('#er'),'Tap again to delete all',()=>{eraseAll();flash('All data deleted from this device.')});
  const V=$('#view');
  V.onchange=e=>{const t=e.target;const nm=t.dataset.sheet;if(!nm||!can)return;const r=DB.report.find(x=>x.name===nm);const o=DB.map[nm]||(DB.map[nm]={});
    if(t.dataset.act==='type'){o.type=t.value;delete o.cols;delete o.hdr}
    if(t.dataset.act==='col'){o.cols=Object.assign({},r&&r.h,o.cols);o.cols[t.dataset.f]=+t.value;if(o.hdr==null&&r)o.hdr=r.hdr}
    if(t.dataset.act==='hdr'){o.hdr=Math.max(0,(+t.value||1)-1);delete o.cols}
    reingest()};
  V.onclick=e=>{const b=e.target.closest('[data-reset]');if(b){delete DB.map[b.dataset.reset];reingest()}};
}
function lockView(){
  $('#view').innerHTML=`<section class="card" style="max-width:420px;width:100%;margin:24px auto;text-align:center"><h1 style="font-size:32px;margin:0 0 6px">Locked</h1><p class="note" style="margin:0 0 14px">Enter your PIN to open your money data.</p>
  <form id="unl"><input type="password" inputmode="numeric" autocomplete="current-password" id="up" aria-label="PIN" style="width:100%;min-height:52px;text-align:center;font-size:24px;letter-spacing:6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><button class="btn pri" style="width:100%;margin-top:10px;justify-content:center">Unlock</button></form>
  ${BIO.on('moneydiary')?`<button class="btn pri" type="button" id="bioB" style="width:100%;margin-top:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v3a8 8 0 0 1-1.5 4.7"/><path d="M8.5 7.5A5 5 0 0 1 17 11v1.5"/><path d="M5 10a7 7 0 0 1 13.5-2.5"/><path d="M8 12v2a12 12 0 0 1-1 4.5"/><path d="M15.5 14.5a14 14 0 0 1-1.2 5"/></svg> Unlock with fingerprint</button>`:''}<p id="um" class="dnc" style="min-height:1.5em;margin:10px 0"></p><button class="btn" type="button" id="forgot">Forgot PIN</button></section>`;
  const f=$('#unl'),m=$('#um');$('#up').focus();
  f.onsubmit=async e=>{e.preventDefault();const left=Math.ceil((waitUntil-Date.now())/1000);if(left>0){m.textContent='Too many tries. Wait '+left+' seconds.';return}
    const btn=f.querySelector('button');btn.disabled=true;m.textContent='';
    try{await unlock($('#up').value);fails=0;$('#status').innerHTML='';render()}
    catch(err){fails++;if(fails>=5)waitUntil=Date.now()+30e3*2**(fails-5);m.textContent=fails>=5?'Wrong PIN. Wait '+Math.round(30*2**(fails-5))+' seconds before trying again.':'Wrong PIN.';btn.disabled=false;$('#up').value=''}};
  confirm2($('#forgot'),'Tap again: erase saved data',eraseAll);
  const bb=$('#bioB');if(bb){const go=async auto=>{m.className='note';m.textContent='Touch the fingerprint sensor…';let p;
      try{p=await BIO.pin('moneydiary')}catch(e){m.textContent=auto?'':BIO.why(e);return}
      m.textContent='Unlocking…';try{await unlock(p);fails=0;$('#status').innerHTML='';render()}
      catch(e){await BIO.off('moneydiary');bb.remove();m.className='dnc';m.textContent='Your PIN was changed. Unlock with your PIN, then turn on fingerprint again in Settings & sync.'}};
    bb.onclick=()=>go(false);if(bioAuto){bioAuto=false;setTimeout(()=>go(true),250)}}
}

  ros.forEach(r=>r.disconnect());ros=[];const V=$('#view');V.oninput=V.onclick=V.onchange=null;
  const route=['overview','years','add','income','search','invest','check','tokens'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';

  if(navHist[navHist.length-1]!==route)navHist.push(route);if(navHist.length>50)navHist.shift();
  $('#backBtn').hidden=locked||navHist.length<2;
  $('#lockBtn').hidden=!KEYOBJ;$('#clearBtn').hidden=locked||!(hasData()||stored());$('nav.tabs').hidden=locked;$('#moreBtn').hidden=locked;$('#yearbar').hidden=locked||route==='add'||route==='years'||!hasData();
  $('label[for=file]').hidden=locked;$('#demoBtn').hidden=locked||(!DB.demo&&(hasData()||!!KEYOBJ||!!stored()));showSync();
  if(locked)return lockView();
  const yrs=[...new Set([...Object.keys(DB.months),...Object.keys(DB.manual),...Object.keys(DB.mf),...Object.keys(DB.biz),...Object.keys(DB.manualM),...Object.keys((DB.dk&&DB.dk.m)||{})].map(k=>k.slice(0,4)))].sort();
  if(!st.year||(st.year!=='all'&&!yrs.includes(st.year)))st.year=yrs[yrs.length-1]||'all';
  $('#year').innerHTML=yrs.map(y=>`<option ${y===st.year?'selected':''}>${y}</option>`).join('')+(yrs.length>1?`<option value="all" ${st.year==='all'?'selected':''}>All years</option>`:'');
  $('#src').textContent=DB.demo?'Showing sample data':'';
  if(route==='check')return viewCheck();
  if(route==='tokens')return viewTokens();
  if(route==='add')viewAdd();
  else if(!hasData())return empty();
  else({overview:viewOverview,years:viewYears,income:viewIncome,search:viewSearch,invest:viewInvest})[route]();
  if(needPin()){V.insertAdjacentHTML('afterbegin',pinCard());bindPinCard()}
  {const w=[];const chk=(o,n)=>{if(!o||!o.exp)return;const d=Math.ceil((savedExp(o.exp)-Date.now())/864e5);if(d<=14)w.push(n+(d<0?' expired on ':' expires on ')+dl(o.exp)+(d>=0?' (in '+d+' day'+(d===1?'':'s')+')':''))};
   chk(DB.sync,'Your sync token');chk(bk(),'Your backup token');
   if(w.length)V.insertAdjacentHTML('afterbegin',`<a class="msg dnc" href="#tokens" style="display:block;text-decoration:none"><b>⚠ ${esc(w.join(' · '))}.</b> Tap here to renew it in the Tokens tab.</a>`)}
}

{let k='midnight';try{k=localStorage.getItem('md.look')||'midnight'}catch(e){}setLook(k,false)}

/* ---------- app updates: check for a newer published version and update with one tap ---------- */
const APP_VERSION=(document.querySelector('meta[name=app-version]')||{}).content||'';
const verOf=html=>{const m=html.match(/<meta name="app-version" content="([^"]+)"/);return m?m[1]:''};
let newVersion='';
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol))return'';
  try{const r=await fetch('./?v='+Date.now(),{cache:'no-store'});if(!r.ok)return'';const v=verOf(await r.text());
    if(v&&v!==APP_VERSION){newVersion=v;$('#updBar').hidden=false}else $('#updBar').hidden=true;return v}catch(e){return''}
}
async function applyUpdate(){
  const b=$('#updBtn');b.disabled=true;b.textContent='Updating…';
  try{
    for(const u of['./','./index.html']){const r=await fetch(u,{cache:'reload'});if(r.ok&&'caches' in window){const ks=await caches.keys();for(const k of ks)if(k.startsWith('money-diary'))await(await caches.open(k)).put(u,r.clone())}}
    if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update().catch(()=>{})}
    location.reload();
  }catch(e){b.disabled=false;b.textContent='Update now';flash('No internet connection. Try updating when you are online.',true)}
}
$('#updBtn').onclick=applyUpdate;
setTimeout(checkUpdate,4000);setInterval(()=>{if(!document.hidden)checkUpdate()},30*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkUpdate,1500)});
addEventListener('online',()=>checkUpdate());

addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;flash('Money Diary is installed. Open it from your home screen.')});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
