/* VOICE: a calm personal money ledger, plain and exact

   PICTURE: month-by-month bars of morning + evening earnings against spending

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#07130d);--card:light-dark(#ffffff,#0c1d14);--ink:light-dark(#0b0b10,#eef5f1);--muted:light-dark(#5a5f6b,#9fb3a8);--line:light-dark(#e4e7ea,#1f3a2c);--mist:light-dark(#eafaf2,#10271b);--band:#00a862;--bandInk:#03130a;--m:light-dark(#257de0,#338ced);--e:light-dark(#00b894,#00a888);--x:light-dark(#d92d2d,#f06363);--up:light-dark(#007a45,#4be09a);--down:light-dark(#b8400c,#ff9466);--b:light-dark(#6a4ce2,#9887ef);--u:light-dark(#8b93a1,#7d8696)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}

.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:12px}.frow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 150px}
.tog{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600;min-height:44px}.tog input{width:22px;height:22px;accent-color:var(--band)}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 44px;gap:8px;margin-bottom:8px}
.xrow input,.xrow select{min-height:44px;font:16px Inter,sans-serif;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.xrow .xdel{padding:0;justify-content:center;font-size:20px}
input:disabled{opacity:.45}

pre,.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="icons/icon-192.png" width="34" height="34" alt="" style="border-radius:9px">Money Diary <span id="syncDot" class="note" hidden></span></div>
    <div class="acts">
      <label class="btn pri" for="file">Upload Excel</label>
      <input id="file" type="file" accept=".xlsx,.csv" multiple hidden>
      <button class="btn pri" id="installBtn" type="button" hidden>Install app</button>
      <button class="btn" id="demoBtn" type="button">Try sample data</button>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>(n<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const short=n=>n>=1e5?'₹'+(n/1e5).toFixed(1).replace(/\.0$/,'')+'L':n>=1e3?'₹'+(n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'k':'₹'+Math.round(n);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const toISO=(y,mo,d)=>y+'-'+pad(mo+1)+'-'+pad(d);
const ymLabel=ym=>MON[+ym.slice(5,7)-1]+' '+ym.slice(2,4);
/* ---------- storage: encrypted with your PIN (AES-256-GCM, key from PBKDF2) ---------- */
const OLD='moneydiary.v1',KEY='moneydiary.enc.v2';
const blank=()=>({months:{},mf:{},mfF:{},biz:{},funds:[],manual:{},manualM:{},del:{},delM:{},map:{},report:[]});
let DB=blank(),KEYOBJ=null,SALT=null,locked=false,noSave=false,fails=0,waitUntil=0;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const canCrypt=!!(window.crypto&&crypto.subtle);
const stored=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}};
async function deriveKey(pin,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function persist(noSync){
  if(!KEYOBJ||DB.demo)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEYOBJ,enc.encode(JSON.stringify(DB))));
  try{localStorage.setItem(KEY,JSON.stringify({v:2,salt:b64(SALT),iv:b64(iv),ct:b64(ct)}))}catch(e){flash('Could not save: this browser’s storage is full.',true)}
  if(!noSync){syncSoon();backupSoon()}
}
async function setPin(pin,noSync){SALT=crypto.getRandomValues(new Uint8Array(16));KEYOBJ=await deriveKey(pin,SALT);PINMEM=pin;noSave=false;await persist(noSync)}
async function unlock(pin){
  const o=stored();const salt=ub64(o.salt);const k=await deriveKey(pin,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct));
  DB=Object.assign(blank(),JSON.parse(dec.decode(pt)));KEYOBJ=k;SALT=salt;PINMEM=pin;locked=false;setTimeout(syncNow,300);setTimeout(()=>runBackup(),9000);
}
function lockNow(){if(!KEYOBJ)return;KEYOBJ=null;PINMEM=null;DB=blank();lastSheets=[];locked=true;render()}
function eraseAll(){PINMEM=null;try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}KEYOBJ=null;SALT=null;DB=blank();lastSheets=[];locked=false;noSave=false;$('#status').innerHTML='';render()}
/* data from the earlier version was saved unencrypted: load it once, then remove it */
try{const s=localStorage.getItem(OLD);if(s){DB=Object.assign(blank(),JSON.parse(s));localStorage.removeItem(OLD)}}catch(e){}
if(stored())locked=true;
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(KEYOBJ&&Date.now()-hiddenAt>5*60e3)lockNow()});
const flash=(t,bad)=>{$('#status').innerHTML='<div class="msg'+(bad?' dnc':'')+'">'+esc(t)+'</div>'};
/* ---------- sync between devices: an encrypted copy in a secret GitHub gist ---------- */
const GH='https://api.github.com',SYNC_FILE='money-diary.sync.json',SYNC_DESC='Money Diary encrypted sync (do not edit)';
let PINMEM=null,syncing=false,syncAgain=false,syncTimer=null;
const syncSt={state:'off',msg:'',at:0,needPin:false};
const syncOn=()=>!!(DB.sync&&DB.sync.token&&KEYOBJ&&!DB.demo);
async function gh(path,opt={},tok){
  let r;try{r=await fetch(GH+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+(tok||DB.sync.token),'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}})}
  catch(e){throw new Error('offline')}
  if(r.status===401||r.status===403)throw new Error('The GitHub token was not accepted. Make a new one with the “gist” box ticked.');
  if(r.status===404)throw new Error('notfound');
  if(!r.ok)throw new Error('GitHub answered with error '+r.status+'. Try again later.');
  return r.status===204?null:r.json();
}
const shareable=db=>{const o=Object.assign({},db);delete o.sync;delete o.demo;return o};
async function sealRemote(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEYOBJ,enc.encode(JSON.stringify(shareable(DB)))));
  return JSON.stringify({app:'money-diary',v:1,salt:b64(SALT),iv:b64(iv),ct:b64(ct),at:Date.now()});
}
async function openRemote(o,pin){
  const salt=ub64(o.salt);const same=SALT&&o.salt===b64(SALT)&&!pin;
  const key=same?KEYOBJ:await deriveKey(pin||PINMEM,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct));
  return{db:JSON.parse(dec.decode(pt)),key,salt};
}
async function readRemote(tok,id){
  const g=await gh('/gists/'+id,{},tok);const f=g.files&&g.files[SYNC_FILE];if(!f)return null;
  let t=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});t=await r.text()}
  return JSON.parse(t);
}
async function findGist(tok){
  for(let p=1;p<=10;p++){const L=await gh('/gists?per_page=100&page='+p,{},tok);const g=L.find(x=>x.files&&x.files[SYNC_FILE]);if(g)return g.id;if(L.length<100)break}
  return null;
}
function pickNewest(L,R,LD,RD){
  const out={},del={};const keys=new Set([...Object.keys(L||{}),...Object.keys(R||{}),...Object.keys(LD||{}),...Object.keys(RD||{})]);
  for(const k of keys){const c=[];
    if(L&&L[k])c.push([L[k],L[k].t||0]);if(R&&R[k])c.push([R[k],R[k].t||0]);
    if(LD&&LD[k]!=null)c.push([null,LD[k]]);if(RD&&RD[k]!=null)c.push([null,RD[k]]);
    let best=null;for(const x of c)if(!best||x[1]>best[1]||(x[1]===best[1]&&x[0]&&!best[0]))best=x;
    if(!best)continue;if(best[0])out[k]=best[0];else del[k]=best[1]}
  return[out,del];
}
function mergeDB(L,R){
  const o=Object.assign(blank(),L);
  if((R.impT||0)>(L.impT||0))for(const k of['months','mf','mfF','biz','funds','report','map','impT'])o[k]=R[k];
  [o.manual,o.del]=pickNewest(L.manual,R.manual,L.del,R.del);
  [o.manualM,o.delM]=pickNewest(L.manualM,R.manualM,L.delM,R.delM);
  {const c=[[L.backup,L.backup?L.backup.setAt||0:-1],[R.backup,R.backup?R.backup.setAt||0:-1],[null,L.backupOff||0],[null,R.backupOff||0]];let best=null;for(const x of c)if(x[1]>=0&&(!best||x[1]>best[1]||(x[1]===best[1]&&x[0]&&(!best[0]||(x[0].lastAt||0)>(best[0].lastAt||0)))))best=x;
   o.backupOff=Math.max(L.backupOff||0,R.backupOff||0);if(best&&best[0])o.backup=best[0];else delete o.backup}
  return o;
}
const sig=db=>JSON.stringify([db.impT||0,db.manual,db.manualM,db.del,db.delM]);
function syncSoon(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1200)}
async function syncNow(){
  if(!syncOn())return;if(syncing){syncAgain=true;return}
  syncing=true;syncSt.state='busy';showSync();
  try{
    const before=sig(DB);let R=null;
    if(DB.sync.gistId){try{R=await readRemote(DB.sync.token,DB.sync.gistId)}catch(e){if(e.message!=='notfound')throw e;DB.sync.gistId=null}}
    if(R){let got;try{got=await openRemote(R)}catch(e){syncSt.needPin=true;throw new Error('The PIN was changed on your other device. Enter that new PIN below to keep syncing.')}
      if(got.salt&&b64(got.salt)!==b64(SALT)){SALT=got.salt;KEYOBJ=got.key}
      DB=Object.assign(mergeDB(DB,got.db),{sync:DB.sync})}
    const body=JSON.stringify({files:{[SYNC_FILE]:{content:await sealRemote()}}});
    if(DB.sync.gistId)await gh('/gists/'+DB.sync.gistId,{method:'PATCH',body});
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:SYNC_DESC,public:false,files:{[SYNC_FILE]:{content:await sealRemote()}}})});DB.sync.gistId=g.id}
    await persist(true);syncSt.state='ok';syncSt.at=Date.now();syncSt.msg='';syncSt.needPin=false;
    if(sig(DB)!==before)render();else showSync();
  }catch(e){syncSt.state=e.message==='offline'?'offline':'err';syncSt.msg=e.message==='offline'?'No internet. Your changes are saved on this device and will sync later.':e.message;if(syncSt.needPin&&location.hash==='#check')render();else showSync()}
  finally{syncing=false;if(syncAgain){syncAgain=false;syncSoon()}}
}
async function connectSync(tok){
  tok=tok.trim();if(!tok)throw new Error('Paste your GitHub token first.');
  const id=await findGist(tok);
  if(id){const R=await readRemote(tok,id);
    if(R){let got;try{got=await openRemote(R,PINMEM)}catch(e){throw new Error('Your other device uses a different PIN. Use the same PIN on both devices: change this device’s PIN in Security, then connect again.')}
      SALT=got.salt;KEYOBJ=got.key;DB=Object.assign(mergeDB(DB,got.db),{sync:{token:tok,gistId:id}})}
    else DB.sync={token:tok,gistId:id};
  }else DB.sync={token:tok,gistId:null};
  await persist(true);await syncNow();
}
async function pushOnly(){if(!syncOn()||!DB.sync.gistId)return;await gh('/gists/'+DB.sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[SYNC_FILE]:{content:await sealRemote()}}})})}
async function changePin(pin){

async function unzip(buf){

  for(let i=0;i<n;i++){

    ents[td.decode(u8.subarray(o+46,o+46+nl))]={m:dv.getUint16(o+10,true),cs:dv.getUint32(o+20,true),lo:dv.getUint32(o+42,true)};

    const s0=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.slice(s0,s0+f.cs);

function readCsv(text,name){

const inP=d=>st.year==='all'||d.startsWith(st.year);
/* empty payment mode counts as Cash, Online counts as GPay */
const fixMode=m=>!m||!String(m).trim()?'Cash':/^online$/i.test(String(m).trim())?'GPay':m;
function allDays(){
  const D={};const g=d=>D[d]||(D[d]={m:0,e:0,off:false,exp:[]});
  for(const ym in DB.months){const M=DB.months[ym];
    for(const d in M.inc){const o=g(d);o.m=M.inc[d].m;o.e=M.inc[d].e;o.u=M.inc[d].u||0;o.off=!!M.inc[d].off}
    for(const x of M.exp)g(x.d).exp.push(x.mode&&!/^online$/i.test(x.mode)?x:Object.assign({},x,{mode:fixMode(x.mode)}))}
  for(const d in DB.manual){const x=DB.manual[d];D[d]={m:x.m,e:x.e,u:x.u||0,off:!!x.off,exp:x.exp.map(z=>({d,item:z.item,amt:z.amt,mode:fixMode(z.mode)})),app:true}}
  return D;
}
function data(){
  const D=allDays(),inc=[],exp=[];
  for(const d in D){if(!inP(d))continue;const o=D[d];if(o.m||o.e||o.u||o.off)inc.push({d,m:o.m,e:o.e,u:o.u||0,off:o.off&&!(o.m+o.e+(o.u||0))});exp.push(...o.exp)}
  inc.sort((a,b)=>a.d<b.d?-1:1);exp.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  return{inc,exp};
}
const mfFOf=ym=>(DB.manualM[ym]&&DB.manualM[ym].mf)||DB.mfF[ym]||(DB.mf[ym]?{MF:DB.mf[ym]}:{});
const mfOf=ym=>Object.values(mfFOf(ym)).reduce((a,b)=>a+b,0);
const bizOf=ym=>DB.manualM[ym]&&DB.manualM[ym].biz!=null?DB.manualM[ym].biz:DB.biz[ym]||0;
const hasData=()=>Object.keys(DB.months).length+Object.keys(DB.manual).length+Object.keys(DB.mf).length+Object.keys(DB.biz).length>0;
function monthRows(){
  const{inc,exp}=data();const M={};const g=k=>M[k]||(M[k]={ym:k,m:0,e:0,u:0,x:0,mf:0,biz:0,days:0,off:0});
  for(const r of inc){const o=g(r.d.slice(0,7));if(r.off)o.off++;else{o.m+=r.m;o.e+=r.e;o.u+=r.u||0;o.days++}}
  for(const r of exp)g(r.d.slice(0,7)).x+=r.amt;
  for(const k of new Set([...Object.keys(DB.mf),...Object.keys(DB.biz),...Object.keys(DB.manualM)]))if(inP(k)&&(mfOf(k)||bizOf(k)))g(k);
  for(const k in M){M[k].mf=mfOf(k);M[k].biz=bizOf(k)}
  return Object.values(M).sort((a,b)=>a.ym<b.ym?-1:1);
}
const norm=s=>String(s).toLowerCase().replace(/\s+/g,' ').trim();
function itemTotals(exp){const T={};for(const x of exp){const k=norm(x.item);const o=T[k]||(T[k]={k,name:x.item,amt:0,n:0});o.amt+=x.amt;o.n++}return Object.values(T).sort((a,b)=>b.amt-a.amt)}
function chg(cur,prev){if(!prev)return'<span class="note">—</span>';const p=(cur-prev)/prev*100;if(Math.abs(p)<.5)return'<span class="note">0%</span>';
  return p>0?'<span class="upc">▲ '+Math.round(p)+'%</span>':'<span class="dnc">▼ '+Math.round(-p)+'%</span>'}
const dl=d=>{const x=new Date(d+'T00:00');return x.getDate()+' '+MON[x.getMonth()]+' '+String(x.getFullYear()).slice(2)};
const todayISO=()=>{const d=new Date();return toISO(d.getFullYear(),d.getMonth(),d.getDate())};

/* ---------- chart ---------- */
let ros=[];const navHist=[];
const niceMax=v=>{const p=10**Math.floor(Math.log10(v));const f=v/p;return([1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>f<=x))*p};
function chart(id,groups){
  const el=document.getElementById(id);if(!el)return;const svg=el.querySelector('svg'),tip=el.querySelector('.tip');let geo=null;
  const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W||!groups.length)return;
    const sm=W<520,pl=sm?40:56,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb;
    const max=niceMax(Math.max(1,...groups.flatMap(g=>g.bars.map(b=>b.reduce((s,x)=>s+x.v,0)))));
    const gw=iw/groups.length,nb=Math.max(...groups.map(g=>g.bars.length));const bw=Math.max(2,Math.min(30,(gw*.74-(nb-1)*2)/nb));
    let s='';
    for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/>`+(sm&&k%2?'':`<text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(max*k/4)}</text>`)}
    const every=Math.ceil(groups.length/(sm?6:14));
    groups.forEach((g,i)=>{const cx=pl+gw*i+gw/2;let x=cx-(nb*bw+(nb-1)*2)/2;
      g.bars.forEach(b=>{let y0=pt+ih;const segs=b.filter(z=>z.v>0);
        segs.forEach((z,j)=>{const h=ih*z.v/max;const top=y0-h,bot=j?y0-2:y0;if(bot-top<=0){y0=top;return}
          const r=j===segs.length-1?Math.min(4,bw/2,bot-top):0;
          s+=`<path d="M${x},${bot}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${bot}Z" fill="${z.c}"/>`;y0=top});
        x+=bw+2});
      if(i%every===0)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(g.label)}</text>`;
    });
    svg.innerHTML=s;geo={pl,gw,W};
  };
  const ro=new ResizeObserver(draw);ro.observe(svg);ros.push(ro);
  svg.onpointermove=ev=>{if(!geo)return;const b=svg.getBoundingClientRect();const x=ev.clientX-b.left;const i=Math.floor((x-geo.pl)/geo.gw);const g=groups[i];
    if(!g){tip.style.display='none';return}
    tip.innerHTML='<b>'+esc(g.tip||g.label)+'</b><br>'+g.bars.flat().filter(z=>z.v||!/no split/.test(z.n)).map(z=>esc(z.n)+': '+inr(z.v)).join('<br>');
    tip.style.display='block';const tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(x+14,geo.W-tw))+'px';tip.style.top=Math.max(0,ev.clientY-b.top-tip.offsetHeight-10)+'px'};
  svg.onpointerleave=()=>{tip.style.display='none'};
  svg.style.cursor=groups.some(g=>g.go)?'pointer':'';
  svg.onclick=ev=>{if(!geo)return;const b=svg.getBoundingClientRect();const i=Math.floor((ev.clientX-b.left-geo.pl)/geo.gw);const g=groups[i];if(g&&g.go)g.go()};
}

async function connectBackup(tok){

  const me=await ghB('/user',{},tok);if(!me||!me.login)throw new Error('The token was not accepted.');
  const repo=await ghB(`/repos/${me.login}/money-diary-backup`,{},tok);

  if(!repo.private)throw new Error('money-diary-backup is public, so anyone could see your money data. Make it private first (Settings › Danger zone › Change visibility).');

  if(!files.length)throw new Error('No BUDGETING year files found in your backup repository yet.');
  let sheets=[];

    <li>Create the private repository: <a href="https://github.com/new?name=money-diary-backup&amp;visibility=private&amp;description=Money+Diary+Excel+backups" target="_blank" rel="noopener">GitHub › new repository</a>. Check the name is <b>money-diary-backup</b> and <b>Private</b> is selected, then tap <b>Create repository</b>.</li>
    <li>Make a backup token: <a href="https://github.com/settings/personal-access-tokens/new?name=Money+Diary+backup&amp;description=Excel+backup&amp;contents=write" target="_blank" rel="noopener">GitHub › new fine-grained token</a>. Set <b>Expiration</b> to the longest choice, under <b>Repository access</b> choose <b>Only select repositories</b> and pick <b>money-diary-backup</b>. <b>Contents: Read and write</b> is already chosen. Tap <b>Generate token</b> and copy it.</li>
    <li>Paste it here and tap <b>Turn on</b>.</li></ol>
    <form id="bkf" style="display:flex;flex-wrap:wrap;gap:8px"><input type="password" name="t" class="in" autocomplete="off" placeholder="Paste backup token (starts with github_pat_)" aria-label="Backup token" style="flex:1 1 240px;width:auto"><button class="btn pri">Turn on</button></form><p id="bkM" class="note" style="margin:6px 0 0"></p>`;
  }
  return h+'</section>';
}
function bindBackup(){
  document.querySelectorAll('[data-dly]').forEach(b=>b.onclick=()=>{downloadBackup(b.dataset.dly);flash(backupName(b.dataset.dly)+' downloaded. Find it in your Downloads folder.')});
  document.querySelectorAll('[data-shy]').forEach(b=>b.onclick=async()=>{if(!await shareBackup(b.dataset.shy)){downloadBackup(b.dataset.shy);flash('Sharing isn’t available here, so the file was downloaded instead.')}});
  const f=$('#bkf');if(f)f.onsubmit=async e=>{e.preventDefault();const m=$('#bkM');m.className='note';m.textContent='Checking your repository…';f.querySelector('button').disabled=true;
    try{await connectBackup(f.t.value);render();flash('Cloud backup is on. Your BUDGETING Excel files are saved in GitHub.')}catch(err){delete DB.backup;m.className='dnc';m.textContent=err.message;f.querySelector('button').disabled=false}};
  const n=$('#bkNow');if(n)n.onclick=()=>runBackup(true);
  confirm2($('#bkOff'),'Tap again to turn off',async()=>{delete DB.backup;DB.backupOff=Date.now();await persist();render()});
  confirm2($('#bkRestore'),'Tap again: restore from cloud',async()=>{const m=$('#bkMsg');m.textContent='Restoring…';try{const r=await restoreLatest();st.year=null;render();flash('Restored from '+r.files.join(', ')+'.')}catch(e){m.className='dnc';m.textContent=e.message}});
}
function syncSection(){
  if(!canCrypt)return'';
  let h=`<section class="card" id="syncCard"><h2>Sync with your laptop</h2>`;
  if(DB.demo)return h+'<p class="note" style="margin:0">Sample data is never synced. Upload your file or add an entry first.</p></section>';
  if(!KEYOBJ)return h+'<p style="margin:0">First set a PIN in <b>Security</b> below. Sync uses it to lock your data before it leaves this device.</p></section>';
  if(DB.sync&&DB.sync.token){
    h+=`<p style="margin:0 0 8px" id="syncStatus">${syncStatusHTML()||'Connected'}</p>
    ${syncSt.needPin?`<form id="npf" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"><input type="password" inputmode="numeric" name="a" class="in" placeholder="PIN from your other device" aria-label="PIN from your other device" style="flex:1 1 200px;width:auto"><button class="btn pri">Use this PIN</button></form><p id="npfM" class="note" style="margin:0 0 8px"></p>`:''}
    <p class="note" style="margin:0 0 10px">Syncs by itself when you save, when you open the app and every 5 minutes. Your data is locked with your PIN before it is sent, so your GitHub account only holds unreadable code.</p>
    <div class="acts"><button class="btn pri" type="button" id="syncBtn">Sync now</button><button class="btn" type="button" id="unsync">Stop syncing on this device</button><button class="btn" type="button" id="delgist">Delete the synced copy</button></div>`;
  }else{
    h+=`<p style="margin:0 0 10px">Your phone and laptop share the same data through a private, encrypted copy kept in your GitHub account. Do this once on each device, using the <b>same PIN</b> on both.</p>
    <ol style="margin:0 0 12px;padding-left:20px">
    <li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Money%20Diary%20sync" target="_blank" rel="noopener">GitHub › new token</a> while signed in. Keep only <b>gist</b> ticked, choose <b>No expiration</b>, tap <b>Generate token</b> and copy it.</li>
    <li>Paste it below and tap <b>Connect</b>.</li>
    <li>On your laptop: open the app, set the same PIN, then paste the same token. Keep the token private, like a password.</li></ol>
    <form id="tokf" style="display:flex;flex-wrap:wrap;gap:8px"><input type="password" name="t" class="in" autocomplete="off" placeholder="Paste GitHub token (starts with ghp_)" aria-label="GitHub token" style="flex:1 1 240px;width:auto"><button class="btn pri">Connect</button></form><p id="tokM" class="note" style="margin:6px 0 0"></p>`;
  }
  return h+'</section>';
}
function bindSync(){
  const f=$('#tokf');if(f)f.onsubmit=async e=>{e.preventDefault();const m=$('#tokM');m.className='note';m.textContent='Connecting…';f.querySelector('button').disabled=true;
    try{await connectSync(f.t.value);render();flash('Sync is on. This device and your other devices now share the same data.')}catch(err){delete DB.sync;m.className='dnc';m.textContent=err.message==='offline'?'No internet connection. Try again when you are online.':err.message;f.querySelector('button').disabled=false}};
  const sb=$('#syncBtn');if(sb)sb.onclick=()=>syncNow();
  confirm2($('#unsync'),'Tap again to stop syncing',async()=>{delete DB.sync;await persist(true);render()});
  confirm2($('#delgist'),'Tap again: delete from GitHub',async()=>{try{await gh('/gists/'+DB.sync.gistId,{method:'DELETE'})}catch(e){if(e.message!=='notfound'){flash(e.message==='offline'?'No internet connection.':e.message,true);return}}delete DB.sync;await persist(true);render();flash('The synced copy was deleted from GitHub. Your data on this device is unchanged.')});
  const n=$('#npf');if(n)n.onsubmit=async e=>{e.preventDefault();const m=$('#npfM');m.textContent='Checking…';try{await enterNewPin(n.a.value)}catch(err){m.className='dnc';m.textContent='That PIN did not open the synced data.'}};
}
function viewCheck(){
  const can=lastSheets.length>0;const reps=DB.report;
  const sel=(attrs,opts)=>`<select ${attrs} style="max-width:100%">${opts}</select>`;
  const ok=(a,b)=>!b?'<span class="note">—</span>':close(a,b)?'<span class="upc">✓ matches</span>':'<span class="dnc">⚠ off by '+inr(Math.abs(a-b))+'</span>';
  const cmp=(l,app,xl)=>`<tr><td>${l}</td><td class="r">${inr(app)}</td><td class="r">${xl?inr(xl):'—'}</td><td>${xl?ok(app,xl):'<span class="note">no total in sheet</span>'}</td></tr>`;
  const typeName={month:'Month sheet',overview:'Yearly overview',skip:'Ignored'};
  const card=r=>{const n=esc(r.name);let h=`<section class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><h2 style="margin:0">Sheet “${n}” ${warnOf(r)?'<span class="dnc">⚠</span>':r.type!=='skip'?'<span class="upc">✓</span>':''}</h2>`;
    h+=can?`<label class="note" style="display:flex;gap:8px;align-items:center">Read as ${sel(`data-sheet="${n}" data-act="type"`,Object.entries(typeName).map(([v,l])=>`<option value="${v}" ${r.type===v?'selected':''}>${l}</option>`).join(''))}</label>`:`<span class="note">${typeName[r.type]||''}</span>`;
    h+='</div>';
    if(r.type==='month'&&!r.empty){
      h+=`<p style="margin:8px 0">Read <b>${r.sum.days}</b> working day${r.sum.days===1?'':'s'}, <b>${r.sum.off}</b> off day${r.sum.off===1?'':'s'} and <b>${r.sum.ne}</b> expense${r.sum.ne===1?'':'s'}, dated ${esc((r.yms||[]).sort().map(ymLabel).join(', '))}.</p>`;
      const x=r.xl;
      h+=`<div class="grid2" style="gap:12px"><div><table><thead><tr><th>App field</th><th>Your column</th></tr></thead><tbody>${FIELDS.map(([k,l])=>`<tr><td>${l}</td><td>${can?sel(`data-sheet="${n}" data-act="col" data-f="${k}" aria-label="${l} column"`,'<option value="-1">— not used —</option>'+r.headers.map((c,i)=>`<option value="${i}" ${r.h[k]===i?'selected':''}>${colName(i)}: ${esc(c.trim()||'(blank)')}</option>`).join('')):(r.h[k]!=null?colName(r.h[k])+': '+esc(r.headers[r.h[k]]||''):'<span class="dnc">not found</span>')}</td></tr>`).join('')}
        <tr><td>Header row</td><td>${can?`<input type="number" min="1" max="60" value="${r.hdr+1}" data-sheet="${n}" data-act="hdr" aria-label="Header row number" class="in" style="width:90px">`:'row '+(r.hdr+1)}</td></tr></tbody></table></div>
        <div><table><thead><tr><th>Total</th><th class="r">App</th><th class="r">Your sheet</th><th></th></tr></thead><tbody>${cmp('Total Credit',r.sum.m+r.sum.e+(r.sum.u||0),x.c||(x.row&&(x.row.m+x.row.e||x.row.c)))}${cmp('Expenses',r.sum.x,x.x||(x.row&&x.row.x))}</tbody></table>
        ${r.miss?`<p class="msg" style="margin:10px 0 0">Your sheet’s TOTAL EXPENCE formula leaves out the last ${r.miss.n} expense row${r.miss.n>1?'s':''} (from row ${r.miss.from}, ${inr(r.miss.amt)}). The app counts them, so its total is the right one. In Excel, extend that SUM range to fix your sheet.</p>`:(r.xl.x&&r.sum.x-r.xl.x>=1?`<p class="msg" style="margin:10px 0 0">The app found ${inr(r.sum.x-r.xl.x)} more expenses than your TOTAL EXPENCE cell. Check that its SUM range covers every row.</p>`:'')}
        <ul style="margin:10px 0 0;padding-left:18px;font-size:14px">${[r.bad&&r.bad+' date'+(r.bad>1?'s':'')+' could not be read; those rows were added to the date above them.',r.swapped&&r.swapped+' date'+(r.swapped>1?'s':'')+' looked like month/day, so '+(r.swapped>1?'they were':'it was')+' read as day/month.',r.outside&&r.outside+' date'+(r.outside>1?'s':'')+' had a different month or year, so '+(r.outside>1?'they were':'it was')+' kept in '+(r.ctx?MON[r.ctx.mo]+' '+r.ctx.y:'this sheet’s month')+'. Worth fixing in Excel.'].filter(Boolean).map(t=>`<li class="dnc">${esc(t)}</li>`).join('')}</ul></div></div>`;
    }else if(r.type==='overview'&&!r.empty){
      const yms=(r.ovYms||[]).filter(ym=>r.ovXl[ym]&&(r.ovXl[ym].c||r.ovXl[ym].x));
      h+=`<p style="margin:8px 0">Read business amount for <b>${r.nBiz}</b> months, MF for <b>${r.nMf}</b> months${r.nFunds?' and <b>'+r.nFunds+'</b> fund accounts (INVEST / ROI)':''}. Below, each month in this sheet is checked against its month sheet. Where expenses are off, the overview has copied a month sheet’s TOTAL EXPENCE that misses some rows; see that month’s card below.</p>
      <div class="scroll"><table style="min-width:520px"><thead><tr><th>Month</th><th class="r">Credit: month sheet</th><th class="r">Credit: overview</th><th></th><th class="r">Expenses: month sheet</th><th class="r">Expenses: overview</th><th></th></tr></thead><tbody>${yms.map(ym=>{const a=excelMonth(ym)||{c:0,x:0},b=r.ovXl[ym];return`<tr><td>${ymLabel(ym)}</td><td class="r">${inr(a.c)}</td><td class="r">${inr(b.c)}</td><td>${ok(a.c,b.c)}</td><td class="r">${inr(a.x)}</td><td class="r">${inr(b.x)}</td><td>${ok(a.x,b.x)}</td></tr>`}).join('')}</tbody></table></div>`;
    }else h+=`<p class="note" style="margin:8px 0 0">${r.type==='skip'?'Not used by the app.':'Nothing could be read from this sheet as '+esc(typeName[r.type]||'')+'.'}</p>`;
    if(can&&DB.map[r.name])h+=`<button class="btn" type="button" data-reset="${n}" style="margin-top:10px">Undo my changes for this sheet</button>`;
    return h+'</section>'};
  const nApp=Object.keys(DB.manual).length;
  let h=`<section class="card"><h2>Import check</h2><p style="margin:0">Each sheet’s totals are compared with the TOTAL CREDIT and TOTAL EXPENCE figures in that sheet, and with your yearly overview. If something is off, pick the right column and everything updates.${can?'':' <b>To change columns, upload your file again:</b> the app reads your Excel file and does not keep it.'}</p>${nApp?`<p class="note" style="margin:8px 0 0">${nApp} day${nApp>1?'s':''} added on the Add entry page replace the same days from Excel.</p>`:''}</section>`;
  h+=DB.demo?'<section class="card"><p style="margin:0">You are looking at sample data. Upload your Excel file to check it here.</p></section>':reps.length?reps.map(card).join(''):'<section class="card"><p style="margin:0">No file read yet.</p></section>';
  h+=`<section class="card"><h2>Security</h2>
  <ul style="margin:0 0 12px;padding-left:18px">
  <li>Your Excel file is read on this device and is never uploaded anywhere. Only the numbers are kept, never the file itself.</li>
  <li>The numbers are saved on this device, encrypted with your PIN (AES-256).</li>
  <li>If you turn on sync, only an encrypted copy goes to your own GitHub account. Without your PIN it is unreadable, even to GitHub.</li>
  <li>The app locks itself after 5 minutes away, and after 5 wrong PINs it makes you wait longer each time.</li>
  <li>If you forget your PIN, the saved data cannot be opened by anyone, including you. Clear it and upload your Excel again.</li></ul>
  ${!canCrypt?'<p class="dnc">This browser can’t encrypt, so nothing is saved.</p>':KEYOBJ?`<p style="margin:0"><b class="upc">✓ Saved and encrypted with your PIN.</b></p><p style="margin:12px 0 0;font-weight:600">Change PIN</p>${pinForm('cp','Change PIN')}<div class="acts" style="margin-top:12px"><button class="btn" type="button" id="lk">Lock now</button><button class="btn" type="button" id="er">Clear all data</button></div>`:DB.demo?'<p class="note" style="margin:0">Sample data is never saved.</p>':hasData()?`<p style="margin:0" class="dnc">Not saved yet: set a PIN to keep this data.</p>${pinForm('pf2','Save with PIN')}<div class="acts" style="margin-top:12px"><button class="btn" type="button" id="er">Clear all data</button></div>`:`<p style="margin:0">Set a PIN to save your data on this device and to turn on sync.</p>${pinForm('pf2','Set PIN')}`}</section>`;
  $('#view').innerHTML=syncSection()+backupSection()+h;bindSync();bindBackup();
  bindPinForm('cp',()=>{flash('PIN changed.');render()});bindPinForm('pf2',()=>{flash('Saved and encrypted with your PIN.');render()});
  const lk=$('#lk');if(lk)lk.onclick=lockNow;confirm2($('#er'),'Tap again to delete all',()=>{eraseAll();flash('All data deleted from this device.')});
  const V=$('#view');
  V.onchange=e=>{const t=e.target;const nm=t.dataset.sheet;if(!nm||!can)return;const r=DB.report.find(x=>x.name===nm);const o=DB.map[nm]||(DB.map[nm]={});
    if(t.dataset.act==='type'){o.type=t.value;delete o.cols;delete o.hdr}
    if(t.dataset.act==='col'){o.cols=Object.assign({},r&&r.h,o.cols);o.cols[t.dataset.f]=+t.value;if(o.hdr==null&&r)o.hdr=r.hdr}
    if(t.dataset.act==='hdr'){o.hdr=Math.max(0,(+t.value||1)-1);delete o.cols}
    reingest()};
  V.onclick=e=>{const b=e.target.closest('[data-reset]');if(b){delete DB.map[b.dataset.reset];reingest()}};
}
function lockView(){
  $('#view').innerHTML=`<section class="card" style="max-width:420px;width:100%;margin:24px auto;text-align:center"><h1 style="font-size:32px;margin:0 0 6px">Locked</h1><p class="note" style="margin:0 0 14px">Enter your PIN to open your money data.</p>
  <form id="unl"><input type="password" inputmode="numeric" autocomplete="current-password" id="up" aria-label="PIN" style="width:100%;min-height:52px;text-align:center;font-size:24px;letter-spacing:6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><button class="btn pri" style="width:100%;margin-top:10px;justify-content:center">Unlock</button></form>
  <p id="um" class="dnc" style="min-height:1.5em;margin:10px 0"></p><button class="btn" type="button" id="forgot">Forgot PIN</button></section>`;
  const f=$('#unl'),m=$('#um');$('#up').focus();
  f.onsubmit=async e=>{e.preventDefault();const left=Math.ceil((waitUntil-Date.now())/1000);if(left>0){m.textContent='Too many tries. Wait '+left+' seconds.';return}
    const btn=f.querySelector('button');btn.disabled=true;m.textContent='';
    try{await unlock($('#up').value);fails=0;$('#status').innerHTML='';render()}
    catch(err){fails++;if(fails>=5)waitUntil=Date.now()+30e3*2**(fails-5);m.textContent=fails>=5?'Wrong PIN. Wait '+Math.round(30*2**(fails-5))+' seconds before trying again.':'Wrong PIN.';btn.disabled=false;$('#up').value=''}};
  confirm2($('#forgot'),'Tap again: erase saved data',eraseAll);
}
function render(){
  ros.forEach(r=>r.disconnect());ros=[];const V=$('#view');V.oninput=V.onclick=V.onchange=null;
  const route=['overview','add','income','search','invest','check'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.r===route));
  if(navHist[navHist.length-1]!==route)navHist.push(route);if(navHist.length>50)navHist.shift();
  $('#backBtn').hidden=locked||navHist.length<2;
  $('#lockBtn').hidden=!KEYOBJ;$('#clearBtn').hidden=locked||!(hasData()||stored());$('nav.tabs').hidden=locked;$('#yearbar').hidden=locked||route==='add'||!hasData();
  $('label[for=file]').hidden=locked;$('#demoBtn').hidden=locked||(!DB.demo&&(hasData()||!!KEYOBJ||!!stored()));showSync();
  if(locked)return lockView();
  const yrs=[...new Set([...Object.keys(DB.months),...Object.keys(DB.manual),...Object.keys(DB.mf),...Object.keys(DB.biz),...Object.keys(DB.manualM)].map(k=>k.slice(0,4)))].sort();
  if(!st.year||(st.year!=='all'&&!yrs.includes(st.year)))st.year=yrs[yrs.length-1]||'all';
  $('#year').innerHTML=yrs.map(y=>`<option ${y===st.year?'selected':''}>${y}</option>`).join('')+(yrs.length>1?`<option value="all" ${st.year==='all'?'selected':''}>All years</option>`:'');
  $('#src').textContent=DB.demo?'Showing sample data':'';
  if(route==='check')return viewCheck();
  if(route==='add')viewAdd();
  else if(!hasData())return empty();
  else({overview:viewOverview,income:viewIncome,search:viewSearch,invest:viewInvest})[route]();
  if(needPin()){V.insertAdjacentHTML('afterbegin',pinCard());bindPinCard()}
}
$('#lockBtn').onclick=lockNow;
$('#backBtn').onclick=()=>{navHist.pop();const to=navHist.pop()||'overview';location.hash=to;scrollTo({top:0})};
confirm2($('#clearBtn'),'Tap again to delete all',()=>{eraseAll();flash('All data deleted from this device.')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;st.q=b.dataset.q;if(location.hash==='#search')render();else location.hash='search'});
$('#file').onchange=e=>{if(e.target.files.length)handleFiles([...e.target.files]);e.target.value=''};
$('#demoBtn').onclick=demo;

$('#year').onchange=e=>{st.year=e.target.value;render()};
addEventListener('hashchange',render);
render();
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#installBtn').hidden=true};
addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;flash('Money Diary is installed. Open it from your home screen.')});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
