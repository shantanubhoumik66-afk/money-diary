    const r=a.getClientExtensionResults&&a.getClientExtensionResults().prf;return r&&r.results&&r.results.first}

    async supported(){try{return !!(window.PublicKeyCredential&&window.isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}},
    on(app){try{return !!JSON.parse(localStorage.getItem(K(app)))}catch(e){return false}},
    async enable(app,label,pin){const salt=rnd(32);
      const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:label},user:{id:rnd(16),name:label+' unlock',displayName:label},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000,extensions:{prf:{eval:{first:salt}}}}});

      let secret=ext.results&&ext.results.first;

const MIG='myshop.idb';let SAVED_T=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('myshop-data',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDo(mode,fn){const db=await idbOpen();try{return await new Promise((res,rej)=>{const tx=db.transaction('kv',mode);const q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('aborted'))})}finally{db.close()}}
const savedAt=t=>{try{return JSON.parse(t).at||0}catch(e){return-1}};
async function storeLoad(){let a=null;try{a=await idbDo('readonly',s=>s.get('main'))}catch(e){if(localStorage.getItem(MIG))throw new Error('store-blocked')}const b=localStorage.getItem(STORE);
  if(a&&b)return savedAt(a)>=savedAt(b)?a:b;return a||b||null}
async function storeSave(txt){let ok=false;
  try{await idbDo('readwrite',s=>s.put(txt,'main'));const back=await idbDo('readonly',s=>s.get('main'));ok=back===txt}catch(e){ok=false}
  if(ok){let m=null;try{m=JSON.parse(localStorage.getItem(MIG))}catch(e){}
    if(!m){try{localStorage.setItem(MIG,JSON.stringify({at:Date.now()}))}catch(e){}}
    else if(Date.now()-m.at>30*864e5&&localStorage.getItem(STORE)){localStorage.removeItem(STORE)}
    SAVED_T=txt;return}
  localStorage.setItem(STORE,txt);SAVED_T=txt}

async function askSeal(){const key=await crypto.subtle.importKey('raw',ub64(DB.link.key),'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const at=Date.now();
  let data=te.encode(JSON.stringify(shareable(DB)));const z=gzOK;if(z)data=await gz(data);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data));return JSON.stringify({app:'myshop-ask',v:1,z,iv:b64(iv),ct:b64(ct),at})}
function askIdb(){return new Promise((res,rej)=>{const r=indexedDB.open('myshop-ask',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function askSave(){clearTimeout(askT);askT=setTimeout(async()=>{try{if(!DB||!DB.link||!DB.link.key)return;const v=await askSeal();const d=await askIdb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,'snap');t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close()}catch(e){}},1500)}
async function persist(noSync){STK=null;askSave();try{await storeSave(await sealWith(KEYOBJ,SALT,DB,true))}catch(e){flash('⚠ Could not save on this device (storage full or blocked). Please sync and download a backup now.',1);throw e}if(!noSync)syncSoon()}
async function setPin(pin,noSync){SALT=crypto.getRandomValues(new Uint8Array(16));KEYOBJ=await deriveKey(pin,SALT);PIN=pin;await persist(noSync)}
const newLink=()=>({key:b64(crypto.getRandomValues(new Uint8Array(32))),t:Date.now()});
const blank=()=>({v:2,shop:{name:'',addr:'',phone:'',gstin:'',mode:'pharmacy',prefix:'INV-',taxIncl:true,upi:'',footer:'Thank you! Please visit again.',dl:'',t:0},items:[],bills:[],custs:[],pays:[],sups:[],spays:[],ins:[],del:{},seq:1,link:newLink()});
function upgrade(db){const now=Date.now();
  for(const k of['items','bills','custs','pays','sups','spays','ins'])db[k]=db[k]||[];if(!db.shop.linkFrom)db.shop.linkFrom=nextYM();if(!db.upItems){for(const it of db.items)if(it.name!==it.name.toUpperCase()){it.name=it.name.toUpperCase();it.t=Date.now()}db.upItems=1}db.del=db.del||{};if(!db.link)db.link=newLink();
  if((db.v||1)<2){const sold={};for(const b of db.bills)for(const l of b.lines){const k=l.itemId+'|'+l.batchId;sold[k]=(sold[k]||0)+l.qty}
    for(const it of db.items){it.t=it.t||now;for(const bt of it.batches){const q=r2((+bt.qty||0)+(sold[it.id+'|'+bt.id]||0));if(q)db.ins.push({id:uid(),item:it.id,batch:bt.id,qty:q,date:today(),note:'Opening stock',t:now});delete bt.qty}}
    for(const x of[...db.custs,...db.pays,...db.bills])x.t=x.t||now;db.shop.t=db.shop.t||now;db.v=2}
  return db}
/* stock is counted from stock entries minus bills, so two devices never overwrite each other's numbers */
let STK=null;
function stk(){if(STK)return STK;const m={};for(const x of DB.ins){const k=x.item+'|'+x.batch;m[k]=(m[k]||0)+x.qty}for(const b of DB.bills)for(const l of b.lines){const k=l.itemId+'|'+l.batchId;m[k]=(m[k]||0)-l.qty}for(const k in m)m[k]=r2(m[k]);return STK=m}
const qB=(it,b)=>stk()[it.id+'|'+b.id]||0;
/* monthly nett: sales - (party payments + customer due still unpaid). Customer payments clear their oldest bills first. */
function nettByMonth(){const M={};const g=ym=>M[ym]||(M[ym]={sales:0,party:0,due:0,nett:0});
  for(const b of DB.bills)g(b.date.slice(0,7)).sales+=b.total;
  for(const p of DB.spays)g(p.date.slice(0,7)).party+=p.amt;
  const byC={};for(const b of DB.bills){const o=b.total-b.paid;if(o<=0.005)continue;if(b.cust)(byC[b.cust.id]||(byC[b.cust.id]=[])).push([b,o]);else g(b.date.slice(0,7)).due+=o}
  for(const cid in byC){let pool=DB.pays.filter(p=>p.cust===cid).reduce((s,p)=>s+p.amt,0);
    for(const[b,o]of byC[cid].sort((x,y)=>x[0].date.localeCompare(y[0].date)||x[0].n-y[0].n)){const use=Math.min(pool,o);pool-=use;if(o-use>0.005)g(b.date.slice(0,7)).due+=o-use}}
  for(const k in M){const x=M[k];x.sales=r2(x.sales);x.party=r2(x.party);x.due=r2(x.due);x.nett=r2(x.sales-x.party-x.due)}return M}
const nextYM=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

const GH='https://api.github.com',SF='dukaan-bill.sync.json',LF='dukaan-link.json',MDF='money-diary.sync.json';
const syncSt={state:'off',msg:'',at:0,needPin:false};let syncing=false,syncAgain=false,syncTimer=null;
const syncOn=()=>!!(DB&&DB.sync&&DB.sync.token&&KEYOBJ);
async function gh(path,opt={},tok){let r;
  try{r=await fetch(GH+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+(tok||DB.sync.token),'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}})}catch(e){throw new Error('offline')}
  if(r.status===401||r.status===403)throw new Error('The GitHub token was not accepted or has expired. Paste a new one below.');
  if(r.status===404)throw new Error('notfound');if(!r.ok)throw new Error('GitHub answered with error '+r.status+'. Try again later.');return r.status===204?null:r.json()}
const shareable=db=>{const o=Object.assign({},db);delete o.sync;return o};
async function fileText(f){if(!f)return null;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});return r.text()}return f.content}
async function readRemote(tok,id){const g=await gh('/gists/'+id,{},tok);return fileText(g.files&&g.files[SF])}
async function findGist(tok){let md=null;for(let p=1;p<=10;p++){const L=await gh('/gists?per_page=100&page='+p,{},tok);
  const g=L.find(x=>x.files&&x.files[SF]);if(g)return g.id;if(!md){const m=L.find(x=>x.files&&x.files[MDF]);if(m)md=m.id}if(L.length<100)break}return md}
async function openRemote(txt,pin){const o=JSON.parse(txt);const same=SALT&&o.salt===b64(SALT)&&!pin;const key=same?KEYOBJ:await deriveKey(pin||PIN,ub64(o.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct));return{db:await unpack(pt,o),key,salt:ub64(o.salt)}}
const COLS=['items','bills','custs','pays','sups','spays','ins'];
function mergeDB(L,R){L=upgrade(L);R=upgrade(R);const o=Object.assign(blank(),L);o.del={...R.del};for(const k in L.del)o.del[k]=Math.max(L.del[k],o.del[k]||0);
  for(const c of COLS){const m=new Map();for(const x of[...L[c],...R[c]]){const y=m.get(x.id);if(!y||(x.t||0)>(y.t||0))m.set(x.id,x)}o[c]=[...m.values()].filter(x=>!(o.del[x.id]>=(x.t||0)))}
  o.shop=(R.shop.t||0)>(L.shop.t||0)?R.shop:L.shop;o.link=(R.link.t||0)<(L.link.t||0)?R.link:L.link;
  o.seq=Math.max(L.seq||1,R.seq||1,...o.bills.map(b=>b.n+1));
  // two devices billing at the same moment can pick the same number: the later bill gets the next free number
  {const used=new Set();let nx=o.seq;for(const b of[...o.bills].sort((x,y)=>(x.t||0)-(y.t||0)||String(x.id).localeCompare(String(y.id)))){if(used.has(b.n)){b.n=nx++;b.no=(o.shop.prefix||'')+b.n;b.renum=1}used.add(b.n)}o.seq=nx}
  // the same customer typed on two devices becomes one account
  const seen={};for(const c of[...o.custs].sort((a,b)=>(a.t||0)-(b.t||0))){const k=c.name.trim().toLowerCase();const f=seen[k];
    if(f&&(!c.phone||!f.phone||c.phone===f.phone)){for(const b of o.bills)if(b.cust&&b.cust.id===c.id)b.cust.id=f.id;for(const p of o.pays)if(p.cust===c.id)p.cust=f.id;if(!f.phone&&c.phone)f.phone=c.phone;o.custs=o.custs.filter(x=>x!==c)}else seen[k]=c}
  return o}
async function linkFile(){const key=await crypto.subtle.importKey('raw',ub64(DB.link.key),'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const at=Date.now();
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify({m:Object.fromEntries(Object.entries(nettByMonth()).filter(([k])=>k>=(DB.shop.linkFrom||'0000'))),from:DB.shop.linkFrom,at,shop:DB.shop.name}))));return JSON.stringify({app:'dukaan-link',v:1,iv:b64(iv),ct:b64(ct),at})}

function syncSoon(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
async function syncNow(){if(!syncOn())return;if(syncing){syncAgain=true;return}syncing=true;syncSt.state='busy';showSync();
  try{const before=sig(DB);let R=null;
    if(DB.sync.gistId){try{R=await readRemote(DB.sync.token,DB.sync.gistId)}catch(e){if(e.message!=='notfound')throw e;DB.sync.gistId=null}}
    if(R){let got;try{got=await openRemote(R)}catch(e){syncSt.needPin=true;throw new Error('The PIN was changed on your other device. Enter that new PIN in Settings to keep syncing.')}
      if(b64(got.salt)!==b64(SALT)){SALT=got.salt;KEYOBJ=got.key}DB=Object.assign(mergeDB(DB,got.db),{sync:DB.sync});STK=null}
    const files={[SF]:{content:await sealWith(KEYOBJ,SALT,shareable(DB),'auto')},[LF]:{content:await linkFile()},[ASKF]:{content:await askSeal()}};
    if(DB.sync.gistId)await gh('/gists/'+DB.sync.gistId,{method:'PATCH',body:JSON.stringify({files})});
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'My Shop encrypted sync (do not edit)',public:false,files})});DB.sync.gistId=g.id}
    await persist(true);try{localStorage.setItem('dukaan.link',DB.link.key)}catch(e){}
    syncSt.state='ok';syncSt.at=Date.now();syncSt.msg='';syncSt.needPin=false;if(sig(DB)!==before&&!/^#(new|item)/.test(location.hash))render();else showSync()}
  catch(e){syncSt.state=e.message==='offline'?'offline':'err';syncSt.msg=e.message==='offline'?'No internet. Your work is saved on this device and will sync later.':e.message;showSync();if(syncSt.needPin&&location.hash==='#settings')render()}
  finally{syncing=false;if(syncAgain){syncAgain=false;syncSoon()}}}
async function connectSync(tok){tok=tok.trim();if(!tok)throw new Error('Paste your GitHub token first.');
  const id=await findGist(tok);DB.sync={token:tok,gistId:id};
  if(id){const R=await readRemote(tok,id);if(R){let got;try{got=await openRemote(R,PIN)}catch(e){DB.sync=null;throw new Error('Your other device uses a different PIN. Use the same PIN on both devices, then connect again.')}
    SALT=got.salt;KEYOBJ=got.key;DB=Object.assign(mergeDB(DB,got.db),{sync:{token:tok,gistId:id}});STK=null}}
  await persist(true);await syncNow()}
async function enterNewPin(pin){const R=await readRemote(DB.sync.token,DB.sync.gistId);const got=await openRemote(R,pin);SALT=got.salt;KEYOBJ=got.key;PIN=pin;DB=Object.assign(mergeDB(DB,got.db),{sync:DB.sync});STK=null;syncSt.needPin=false;await persist(true);await syncNow();render()}

function lineCalc(l){const g=0,gross=(+l.qty||0)*(+l.rate||0),d=gross*(+l.disc||0)/100;let amt=gross-d,taxable,tax;
  if(true){taxable=amt/(1+g/100);tax=amt-taxable}else{taxable=amt;tax=amt*g/100;amt=taxable+tax}return{gross,d,taxable,tax,amt}}
function billCalc(lines,ro){const t={taxable:0,tax:0,amt:0,disc:0,gross:0,byRate:{}};for(const l of lines){const c=lineCalc(l);t.gross+=c.gross;t.taxable+=c.taxable;t.tax+=c.tax;t.amt+=c.amt;t.disc+=c.d;
  const k=+l.gst||0;const r=t.byRate[k]||(t.byRate[k]={taxable:0,tax:0});r.taxable+=c.taxable;r.tax+=c.tax}if(ro!=null&&ro!==''&&isFinite(+ro)){t.round=r2(+ro);t.total=r2(t.amt+t.round)}else{t.total=Math.round(t.amt);t.round=t.total-t.amt}return t}

/* ---------- home ---------- */
function alerts(){const ex=[],soon=[],low=[];
  for(const it of DB.items){for(const b of it.batches){if(!(qB(it,b)>0)||!b.exp)continue;const m=monthsLeft(b.exp);if(m<0)ex.push([it,b]);else if(m<=3)soon.push([it,b])}
    if(it.low&&qtyOf(it)<=it.low)low.push(it)}
  soon.sort((x,y)=>x[1].exp.localeCompare(y[1].exp));return{ex,soon,low}}
/* ---------- sales comparison of months you pick ---------- */
const ymAdd=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const ymS=ym=>new Date(ym+'-01T00:00').toLocaleDateString('en-IN',{month:'short'})+" '"+ym.slice(2,4);
const kfmt=v=>v>=1e7?'₹'+r2(v/1e7)+' Cr':v>=1e5?'₹'+r2(v/1e5)+' L':v>=1e3?'₹'+(Math.round(v/100)/10)+'k':'₹'+Math.round(v);
function salesByMonth(){const M={};for(const b of DB.bills){const k=b.date.slice(0,7);M[k]=(M[k]||0)+b.total}return M}
function cmpMonths(){const Y=homeYear(),cur=today().slice(0,7);const L=[];for(let m=1;m<=12;m++){const k=Y+'-'+pad(m);if(k<=cur)L.push(k)}return L.reverse()}
function cmpSel(){let a;try{a=JSON.parse(localStorage.getItem('myshop.cmp'))}catch(e){}const Y=homeYear(),L=cmpMonths();a=Array.isArray(a)?a.filter(k=>k.startsWith(Y)):[];return a.length?a:L.slice(0,2).reverse()}
function cmpHTML(){const S=salesByMonth(),sel=[...new Set(cmpSel())].sort(),cur=today().slice(0,7);
  const pre=[['2','Last 2'],['3','Last 3'],['6','Last 6']];
  return`<section class="card stack" id="cmpCard"><div class="row"><h2 class="sp">Sales comparison</h2></div>
   <p class="note" style="margin:0">Tap the months you want to compare.</p>
   <div class="chips">${pre.map(([n,t])=>`<button type="button" class="chip" data-cpre="${n}">${t} months</button>`).join('')}</div>
   <div class="chips" style="flex-wrap:wrap">${cmpMonths().map(k=>`<button type="button" class="chip ${sel.includes(k)?'on':''}" data-cm="${k}" aria-pressed="${sel.includes(k)}">${ymS(k)}</button>`).join('')}</div>
   ${cmpChart(sel,S)}${cmpDiff(sel,S)}</section>`}
function cmpChart(sel,S){if(!sel.length)return'<p class="empty">Pick at least one month.</p>';
  const W=Math.max(320,sel.length*86),H=230,top=34,bot=40,ph=H-top-bot,max=Math.max(1,...sel.map(k=>S[k]||0));const bw=Math.min(46,(W/sel.length)*0.5);
  const bars=sel.map((k,i)=>{const v=S[k]||0,cx=(i+0.5)*W/sel.length,h=Math.max(v?3:0,v/max*ph),y=top+ph-h;
    return`<g><title>${ymL(k)}: ${inr(v)}</title><path d="M${cx-bw/2},${top+ph}V${y+Math.min(4,h)}a4,4 0 0 1 4,-4h${bw-8}a4,4 0 0 1 4,4V${top+ph}Z" fill="var(--acc)"/>
     <text x="${cx}" y="${y-8}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${v?kfmt(v):'₹0'}</text>
     <text x="${cx}" y="${top+ph+22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)">${ymS(k)}</text></g>`}).join('');
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px;max-height:260px" role="img" aria-label="Sales by month: ${sel.map(k=>ymL(k)+' '+inr(S[k]||0)).join(', ')}">
   <line x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}" stroke="var(--line)" stroke-width="1.5"/>${bars}</svg></div>`}
function cmpDiff(sel,S){if(sel.length<2)return'';const row=(a,b)=>{const x=S[a]||0,y=S[b]||0,d=y-x,pc=x?Math.round(d/x*100):null;
    return`<div class="li" style="cursor:default"><span class="t"><b>${ymS(a)} → ${ymS(b)}</b><small>${inr(x)} → ${inr(y)}</small></span><span class="a ${d>0?'grn':d<0?'red':''}">${d>0?'▲ +':d<0?'▼ −':''}${inr(Math.abs(d))}${pc!=null&&d?`<br><small>${d>0?'+':'−'}${Math.abs(pc)}%</small>`:''}</span></div>`};
  const pairs=[];for(let i=1;i<sel.length;i++)pairs.push(row(sel[i-1],sel[i]));if(sel.length>2)pairs.push(row(sel[0],sel[sel.length-1]).replace('<b>','<b>Overall: '));
  return`<div class="list">${pairs.join('')}</div>`}
function bindCmp(){const card=$('#cmpCard');if(!card)return;const save=a=>{try{localStorage.setItem('myshop.cmp',JSON.stringify(a))}catch(e){}card.outerHTML=cmpHTML();bindCmp()};
  card.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{const k=b.dataset.cm;let a=cmpSel();a=a.includes(k)?a.filter(x=>x!==k):[...a,k];save(a)});
  card.querySelectorAll('[data-cpre]').forEach(b=>b.onclick=()=>{const n=+b.dataset.cpre;save(cmpMonths().slice(0,n).reverse())})}
/* ---------- year on Home, all-years summary, customer performance ---------- */
const yearsAll=()=>{const Y=new Set([today().slice(0,4)]);for(const b of DB.bills)Y.add(b.date.slice(0,4));for(const p of DB.spays)Y.add(p.date.slice(0,4));return[...Y].sort().reverse()};
const homeYear=()=>{const y=st.hy||today().slice(0,4);return yearsAll().includes(y)?y:today().slice(0,4)};
/* money actually received, by month: Cash vs Online (UPI, card, bank) */
function recvByMonth(){const M={};const g=k=>M[k]||(M[k]={cash:0,online:0});const add=(d,mode,amt)=>{if(!(amt>0))return;const o=g(d.slice(0,7));if(/^cash$/i.test(mode||'Cash'))o.cash+=amt;else o.online+=amt};
  for(const b of DB.bills)if(!/^(due|deposit|udhaar)$/i.test(b.mode||''))add(b.date,b.mode,b.paid);
  for(const p of DB.pays)if(p.kind!=='adj'&&p.mode!=='Adjust')add(p.date,p.mode,p.amt);
  for(const k in M){M[k].cash=r2(M[k].cash);M[k].online=r2(M[k].online)}return M}
function viewSummary(){const NM=nettByMonth();const Y={};const g=y=>Y[y]||(Y[y]={sales:0,n:0,party:0,due:0,nett:0,custs:new Set()});
  for(const b of DB.bills){const o=g(b.date.slice(0,4));o.sales+=b.total;o.n++;if(b.cust)o.custs.add(b.cust.id)}
  for(const k in NM){const o=g(k.slice(0,4));o.party+=NM[k].party;o.due+=NM[k].due;o.nett+=NM[k].nett}
  const RM=recvByMonth();for(const k in RM){const o=g(k.slice(0,4));o.cash=(o.cash||0)+RM[k].cash;o.online=(o.online||0)+RM[k].online}
  const ys=Object.keys(Y).sort();const T={sales:0,n:0,party:0,due:0,nett:0,cash:0,online:0};for(const y of ys)for(const k in T)T[k]+=Y[y][k]||0;
  const max=Math.max(1,...ys.map(y=>Y[y].sales));const W=Math.max(320,ys.length*110),H=220,top=30,ph=H-top-40,bw=48;
  const chart=ys.length?`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:240px" role="img" aria-label="Sales by year">${ys.map((y,i)=>{const v=Y[y].sales,cx=(i+.5)*W/ys.length,h=Math.max(v?3:0,v/max*ph),yy=top+ph-h;
    return`<g><title>${y}: ${inr(v)}</title><path d="M${cx-bw/2},${top+ph}V${yy+Math.min(4,h)}a4,4 0 0 1 4,-4h${bw-8}a4,4 0 0 1 4,4V${top+ph}Z" fill="var(--acc)"/><text x="${cx}" y="${yy-8}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${kfmt(v)}</text><text x="${cx}" y="${top+ph+22}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">${y}</text></g>`}).join('')}<line x1="0" x2="${W}" y1="${top+ph}" y2="${top+ph}" stroke="var(--line)"/></svg></div>`:'';
  $('#view').innerHTML=`<div class="row"><h2 class="sp">Summary · all years</h2><a class="btn sm" href="#home">← Home</a></div>
   <div class="kpis"><div class="kpi hero"><span>Total sales, all years</span><b>${inr(T.sales)}</b></div><div class="kpi"><span>Sale invoices</span><b>${T.n.toLocaleString('en-IN')}</b></div>
    <div class="kpi"><span>Party payments</span><b>${inr(T.party)}</b></div><div class="kpi"><span>Total nett</span><b>${inr(T.nett)}</b></div>
    <div class="kpi"><span>💵 Cash received, all years</span><b class="grn">${inr(T.cash)}</b></div><div class="kpi"><span>📱 Online received, all years</span><b style="color:#2563eb">${inr(T.online)}</b></div></div>
   <section class="card stack"><h2>Sales by year</h2>${chart||'<p class="empty">No sales yet.</p>'}
    <div style="overflow-x:auto"><table class="t"><thead><tr><th>Year</th><th class="r">Sales</th><th class="r">Invoices</th><th class="r">Customers</th><th class="r">Cash</th><th class="r">Online</th><th class="r">Party paid</th><th class="r">Due pending</th><th class="r">Nett</th></tr></thead><tbody>
     ${ys.slice().reverse().map(y=>{const o=Y[y];return`<tr><td><a href="#home" data-gy="${y}">${y}</a></td><td class="r">${inr(o.sales)}</td><td class="r">${o.n}</td><td class="r">${o.custs.size}</td><td class="r">${inr(o.cash||0)}</td><td class="r">${inr(o.online||0)}</td><td class="r">${inr(o.party)}</td><td class="r ${o.due?'red':''}">${inr(o.due)}</td><td class="r"><b>${inr(o.nett)}</b></td></tr>`}).join('')}
     <tr><td><b>All years</b></td><td class="r"><b>${inr(T.sales)}</b></td><td class="r"><b>${T.n}</b></td><td></td><td class="r"><b>${inr(T.cash)}</b></td><td class="r"><b>${inr(T.online)}</b></td><td class="r"><b>${inr(T.party)}</b></td><td class="r"><b>${inr(T.due)}</b></td><td class="r"><b>${inr(T.nett)}</b></td></tr></tbody></table></div>
    <p class="note" style="margin:0">Tap a year to open Home for that year.</p></section>`;
  $$('[data-gy]').forEach(a=>a.onclick=()=>{st.hy=a.dataset.gy})}
/* customer performance */
const custKey=b=>b.cust?b.cust.id:'walkin';
const custName=k=>k==='walkin'?'Walk-in customers':((custById(k)||{}).name||DB.bills.find(b=>b.cust&&b.cust.id===k)?.cust.name||'Customer');
const perKey=(d,typ)=>typ==='mom'?d.slice(0,7):typ==='qoq'?d.slice(0,4)+'-Q'+(Math.floor((+d.slice(5,7)-1)/3)+1):d.slice(0,4);
const perPrev=(k,typ)=>{if(typ==='mom')return ymAdd(k,-1);if(typ==='yoy')return String(+k-1);const y=+k.slice(0,4),q=+k.slice(6);return q>1?y+'-Q'+(q-1):(y-1)+'-Q4'};
const perLabel=(k,typ)=>typ==='mom'?ymL(k):typ==='qoq'?['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'][+k.slice(6)-1]+' '+k.slice(0,4):k;
function viewPerf(){const typ=st.ptyp||'mom';const T=today();const keys=new Set([perKey(T,typ)]);for(const b of DB.bills)keys.add(perKey(b.date,typ));
  const list=[...keys].sort().reverse();const cur=list.includes(st.pk)?st.pk:perKey(T,typ);const prev=perPrev(cur,typ);
  const C={};for(const b of DB.bills){const k=perKey(b.date,typ);if(k!==cur&&k!==prev)continue;const c=custKey(b);const o=C[c]||(C[c]={a:0,b:0,n:0});if(k===cur){o.a+=b.total;o.n++}else o.b+=b.total}
  const rows=Object.entries(C).map(([k,o])=>({k,name:custName(k),...o,d:o.a-o.b})).sort((x,y)=>st.plow?(x.a-y.a):(y.a-x.a));
  const tot=rows.reduce((s,r)=>s+r.a,0),totB=rows.reduce((s,r)=>s+r.b,0);
  const allC=[...new Set(DB.bills.map(custKey))].map(k=>({k,name:custName(k),s:DB.bills.filter(b=>custKey(b)===k).reduce((s,b)=>s+b.total,0)})).sort((a,b)=>b.s-a.s);
  const A=st.ca&&allC.some(c=>c.k===st.ca)?st.ca:(allC[0]||{}).k,B=st.cb&&allC.some(c=>c.k===st.cb)?st.cb:(allC[1]||allC[0]||{}).k;
  $('#view').innerHTML=`<div class="row"><a class="btn sm" href="#parties">← Parties</a><h2 class="sp" style="margin-left:6px">Customer performance</h2></div>
   <section class="card stack"><div class="chips">${[['mom','Month on month (MoM)'],['qoq','Quarter on quarter (QoQ)'],['yoy','Year on year (YoY)']].map(([k,t])=>`<button type="button" class="chip ${typ===k?'on':''}" data-ptyp="${k}">${t}</button>`).join('')}</div>
    <div class="grid g2"><label class="f">Period<select class="in" id="pk">${list.map(k=>`<option value="${k}" ${k===cur?'selected':''}>${perLabel(k,typ)}</option>`).join('')}</select></label>
     <label class="f">Order<select class="in" id="plow"><option value="0" ${st.plow?'':'selected'}>Highest sales first</option><option value="1" ${st.plow?'selected':''}>Lowest sales first</option></select></label></div>
    <p style="margin:0">${perLabel(cur,typ)}: <b>${inr(tot)}</b> · compared with ${perLabel(prev,typ)}: ${inr(totB)} <span class="${tot>=totB?'grn':'red'}">${tot>=totB?'▲ +':'▼ −'}${inr(Math.abs(tot-totB))}</span></p>
    ${rows.length?`<div style="overflow-x:auto"><table class="t"><thead><tr><th>#</th><th>Customer</th><th class="r">${esc(perLabel(cur,typ))}</th><th class="r">${esc(perLabel(prev,typ))}</th><th class="r">Change</th></tr></thead><tbody>
     ${rows.map((r,i)=>{const pc=r.b?Math.round(r.d/r.b*100):null;return`<tr><td>${i+1}</td><td>${r.k!=='walkin'?`<a href="#party/${r.k}">${esc(r.name)}</a>`:esc(r.name)}${!st.plow&&i<3&&r.a?' <span class="pill p-grn">Top</span>':''}${r.a===0?' <span class="pill p-red">No sales</span>':''}</td><td class="r"><b>${inr(r.a)}</b></td><td class="r">${inr(r.b)}</td><td class="r ${r.d>0?'grn':r.d<0?'red':''}">${r.d>0?'▲ +':r.d<0?'▼ −':''}${inr(Math.abs(r.d))}${pc!=null&&r.d?`<br><small>${r.d>0?'+':'−'}${Math.abs(pc)}%</small>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No sales in these periods.</p>'}</section>
   <section class="card stack"><h2>Compare two customers</h2>${allC.length<2?'<p class="empty">You need sales to at least two customers to compare.</p>':`
    <div class="grid g2"><label class="f"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--acc);vertical-align:-1px"></i> Customer 1</span><select class="in" id="ca">${allC.map(c=>`<option value="${c.k}" ${c.k===A?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
     <label class="f"><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#d97706;vertical-align:-1px"></i> Customer 2</span><select class="in" id="cb">${allC.map(c=>`<option value="${c.k}" ${c.k===B?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>
    ${pairChart(A,B)}`}</section>`;
  $$('[data-ptyp]').forEach(b=>b.onclick=()=>{st.ptyp=b.dataset.ptyp;st.pk=null;viewPerf()});$('#pk').onchange=e=>{st.pk=e.target.value;viewPerf()};$('#plow').onchange=e=>{st.plow=e.target.value==='1';viewPerf()};
  if($('#ca')){$('#ca').onchange=e=>{st.ca=e.target.value;viewPerf()};$('#cb').onchange=e=>{st.cb=e.target.value;viewPerf()}}}
function pairChart(A,B){const cur=today().slice(0,7);const M=Array.from({length:6},(_,i)=>ymAdd(cur,i-5));const sum=(k,f)=>DB.bills.filter(b=>custKey(b)===k&&f(b)).reduce((s,b)=>s+b.total,0);
  const a=M.map(m=>sum(A,b=>b.date.startsWith(m))),bb=M.map(m=>sum(B,b=>b.date.startsWith(m)));const max=Math.max(1,...a,...bb);
  const W=Math.max(330,M.length*58),H=240,top=34,ph=H-top-40,bw=19;
  const bars=M.map((m,i)=>{const cx=(i+.5)*W/M.length;return[[a[i],cx-bw/2-1,'var(--acc)'],[bb[i],cx+bw/2+1,'#d97706']].map(([v,x,c])=>{const h=Math.max(v?3:0,v/max*ph),y=top+ph-h;
      return`<g><title>${ymL(m)}: ${inr(v)}</title><path d="M${x-bw/2},${top+ph}V${y+Math.min(3,h)}a3,3 0 0 1 3,-3h${bw-6}a3,3 0 0 1 3,3V${top+ph}Z" fill="${c}"/>${v?`<text x="${x}" y="${y-6}" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--ink)">${kfmt(v)}</text>`:''}</g>`}).join('')+`<text x="${cx}" y="${top+ph+22}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${ymS(m)}</text>`}).join('');

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let p=buf.byteLength-22;

  const n=dv.getUint16(p+10,true);let o=dv.getUint32(p+16,true);const ents={};
  for(let i=0;i<n;i++){
    const nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true);
    ents[td.decode(u8.subarray(o+46,o+46+nl))]={m:dv.getUint16(o+10,true),cs:dv.getUint32(o+20,true),lo:dv.getUint32(o+42,true)};
    o+=46+nl+el+cl;
  }
  return async name=>{const f=ents[name];if(!f)return null;
    const s0=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.slice(s0,s0+f.cs);
    if(f.m===0)return td.decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();};

function importsList(){const G=new Map();for(const e of DB.ins){if(!/^Imported from /.test(e.note||''))continue;const k=e.imp||('old:'+e.note+'|'+e.t);const g=G.get(k)||{k,file:e.note.slice(14),t:e.t,E:[]};g.E.push(e);G.set(k,g)}
  for(const it of DB.items)if(it.imp&&!G.has(it.imp))G.set(it.imp,{k:it.imp,file:'',t:it.t,E:[]});
  return[...G.values()].sort((a,b)=>b.t-a.t)}
async function undoImport(g){const ids=new Set(g.E.map(e=>e.id));let copy=null;
  const needOld=g.E.some(e=>!('oldPrice' in e)&&!e.newItem);
  if(needOld&&syncOn()){try{const L=await gh('/gists/'+DB.sync.gistId+'/commits?per_page=60');
      for(const c of L){const gg=await gh('/gists/'+DB.sync.gistId+'/'+c.version);const t=await fileText(gg.files&&gg.files[SF]);if(!t)continue;const d=upgrade((await openRemote(t)).db);if(!d.ins.some(e=>ids.has(e.id))){copy=d;break}}}catch(e){}}
  let nItems=0,nRemoved=0,nPrice=0;const now=Date.now();const touched=new Set(g.E.map(e=>e.item));if(g.k&&!g.k.startsWith('old:'))for(const it of DB.items)if(it.imp===g.k)touched.add(it.id);
  for(const id of touched){const it=itemById(id);if(!it)continue;const mine=g.E.filter(e=>e.item===id);
    const created=it.imp===g.k||mine.some(e=>e.newItem)||(copy?!copy.items.some(x=>x.id===id):!DB.ins.some(e=>e.item===id&&!ids.has(e.id)));
    const used=DB.bills.some(b=>b.lines.some(l=>l.itemId===id));
    if(created&&!used){gone('items',id);nRemoved++;continue}
    const op=mine.find(e=>'oldPrice' in e);const cp=copy&&copy.items.find(x=>x.id===id);const old=op?op.oldPrice:cp?cp.price:null;
    if(old!=null&&old!==it.price){it.price=old;nPrice++}if(cp&&cp.salt!==undefined&&!op)it.salt=cp.salt;it.t=now;nItems++}

  return{nItems,nRemoved,nPrice,noCopy:needOld&&!copy}}

    el.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Restoring…';const n=bringBack(C[+b.dataset.cp].d);await persist();location.hash='#stock';setTimeout(()=>flash('✓ Brought back '+n+' missing record'+(n===1?'':'s')+' (items, stock entries, invoices or customers).'),60)})})
   .catch(e=>{const el=$('#cpL');if(el)el.innerHTML=`<p class="red">${esc(e.message==='offline'?'No internet. Connect and try again.':e.message)}</p>`})}
function viewSettings(sub){if(sub==='recover')return viewRecover();const S=DB.shop,ph=isPh(),P=PS();

"row" style="gap:10px;min-height:40px;font-weight:600;flex-wrap:nowrap"><input type="checkbox" data-pk="paid" ${P.paid?'checked':''} style="width:22px;height:22px;flex:none">Received and balance due</label><label class="row" style="gap:10px;min-height:40px;font-weight:600;flex-wrap:nowrap"><input type="checkbox" data-pk="footer" ${P.footer?'checked':''} style="width:22px;height:22px;flex:none">Message at the bottom</label><label class="row" style="gap:10px;min-height:40px;font-weight:600;flex-wrap:nowrap"><input type="checkbox" data-pk="upi" ${P.upi?'checked':''} style="width:22px;height:22px;flex:none">UPI ID when money is due</label></div>

   <div class="stack"><section class="card stack"><h3>Backup</h3><p class="note" style="margin:0">Your data lives only on this device. Download a backup file regularly and keep it in Google Drive. The file is locked with your current PIN.</p>

    <div class="row"><button class="btn" id="cs1">Sales report (Excel CSV)</button><button class="btn" id="cs2">Stock list (Excel CSV)</button></div></section>
   <section class="card stack"><h3>Sync phone &amp; laptop + Money Diary link</h3>
    ${syncOn()?`<p id="syncStatus" style="margin:0"></p>${syncSt.needPin?`<label class="f">PIN used on your other device<input class="in" id="npin" type="password" inputmode="numeric"></label><button class="btn pri" id="npinB">Use this PIN</button>`:''}
     <p class="note" style="margin:0">Your sale invoices, stock and parties sync automatically. Each month's nett is added to the Business amount in Money Diary (open Money Diary once on this device to link it).</p>
     <div class="row"><label class="f sp">Send nett to Money Diary from<input class="in" type="month" id="lfrom" value="${esc(DB.shop.linkFrom||'')}"></label></div>
     <p class="note" style="margin:0">Your own typed business amount is kept; My Shop's nett is added to it.</p>
     <div class="row"><button class="btn" id="syncB">Sync now</button><button class="btn" id="tokB">Change token</button><button class="btn red" id="offB">Turn off sync</button></div>`
    :`<p class="note" style="margin:0">Paste the <b>same GitHub sync token you use in Money Diary</b> (its Tokens tab). Use the <b>same PIN</b> on your phone and laptop. Data is encrypted with your PIN before it leaves this device.</p>`}
    <div id="tokRow" class="stack" ${syncOn()?'hidden':''}><label class="f">GitHub token<input class="in" id="tok" type="password" autocomplete="off" placeholder="ghp_… or github_pat_…"></label><button class="btn pri" id="conB">Connect and sync</button></div><p id="sm" class="note" style="margin:0"></p></section>
   <section class="card stack" id="bioCard" hidden><h3>Fingerprint / face unlock</h3><p class="note" style="margin:0">Open the app with your fingerprint instead of typing the PIN. Your PIN still works and still protects the data. Turn this on separately on your phone and on your laptop.</p><p id="bioSt" style="margin:0"></p><button class="btn pri" id="bioOn">Turn on fingerprint unlock</button><button class="btn red" id="bioOff">Turn off fingerprint unlock</button></section>
   <section class="card stack"><h3>App version &amp; update</h3><p style="margin:0">You are using version <b>${esc(MYV)}</b>.</p>
    <div class="row"><button class="btn" id="chkU">Check for updates</button><button class="btn pri" id="updNow">Update now</button></div><p id="chkM" class="note" style="margin:0"></p></section>
   <section class="card stack"><h3>PIN and security</h3><div class="grid g2"><label class="f">Current PIN<input class="in" id="op" type="password" inputmode="numeric"></label><label class="f">New PIN<input class="in" id="np" type="password" inputmode="numeric"></label></div>
    <button class="btn" id="chp">Change PIN</button><button class="btn" id="lk">Lock now</button><button class="btn red" id="wipe">Erase all data on this device</button>
    <p class="note" style="margin:0">The app locks itself after 10 minutes without use. Data is encrypted with AES-256 using your PIN.</p></section></div></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const v=k=>$('#s_'+k).value.trim();Object.assign(S,{name:v('name'),addr:v('addr'),phone:v('phone'),dl:v('dl'),upi:v('upi'),prefix:v('prefix'),mode:v('mode'),taxIncl:true,footer:v('footer')});
    const sq=parseInt(v('seq'));if(sq>0)DB.seq=sq;S.t=Date.now();await persist();render();flash('✓ Shop details saved.')};
  $('#bk').onclick=async()=>{download('MyShop-backup-'+today()+'.dukaan',await sealWith(KEYOBJ,SALT,DB,'auto'),'application/json');flash('✓ Backup downloaded. Save it to Google Drive. You need your current PIN to restore it.')};
  $('#rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const pin=prompt('Type the PIN that was used when this backup was made');if(!pin)return;
    try{const o=await openWith(pin.trim(),await f.text());const keep=DB.sync;DB=upgrade(o.db);if(keep)DB.sync=keep;await persist();render();flash('✓ Backup restored: '+DB.bills.length+' invoices, '+DB.items.length+' items.')}catch(err){flash('Could not open this file. Check the PIN and that it is a My Shop backup.',1)}e.target.value=''};
  $('#cs1').onclick=()=>{const rows=[['Invoice no','Date','Customer','Mobile','Item','Batch','Expiry','Qty','MRP','Disc %','Amount','Invoice total','Received','Mode']];
    for(const b of[...DB.bills].sort((a,c)=>a.n-c.n))for(const l of b.lines){const c=lineCalc(l);rows.push([b.no,dl(b.date),b.cust?.name||'',b.cust?.phone||'',l.name,l.batch||'',expL(l.exp),l.qty,l.rate,l.disc||0,r2(c.amt),b.total,b.recv!=null?b.recv:b.paid,modeL(b.mode)])}
    download('Sales-'+today()+'.csv',csv(rows),'text/csv')};
  $('#cs2').onclick=()=>{const rows=[['Item','Salt','Unit','MRP','Rack','Batch','Expiry','Qty']];for(const i of DB.items)for(const b of(i.batches.length?i.batches:[{}]))rows.push([i.name,i.salt||'',i.unit||'',i.price,i.rack||'',b.b||'',expL(b.exp),b.id?qB(i,b):0]);download('Stock-'+today()+'.csv',csv(rows),'text/csv')};
  $('#chp').onclick=async()=>{const o=$('#op').value.trim(),n=$('#np').value.trim();if(o!==PIN){flash('Current PIN is wrong.',1);return}if(!/^\d{4,12}$/.test(n)){flash('New PIN must be 4 to 12 digits.',1);return}if(syncOn())await syncNow();clearTimeout(syncTimer);await setPin(n,true);if(syncOn())await syncNow();if(BIO.on('myshop')){try{await BIO.enable('myshop','My Shop',n)}catch(e){await BIO.off('myshop')}}$('#op').value=$('#np').value='';flash('✓ PIN changed. Download a new backup file, because old backups still use the old PIN.')};
  $('#lk').onclick=lockNow;showSync();
  $('#psave').onclick=async()=>{const o={};$$('[data-pk]').forEach(c=>o[c.dataset.pk]=c.checked?1:0);o.paper=$('#ppaper').value;S.print=o;S.t=Date.now();await persist();flash('✓ Print settings saved.')};
  $('#pprev').onclick=()=>{const o={};$$('[data-pk]').forEach(c=>o[c.dataset.pk]=c.checked?1:0);o.paper=$('#ppaper').value;const keep=S.print;S.print=o;
    const b=[...DB.bills].sort((x,y)=>(y.t||0)-(x.t||0))[0]||{no:(S.prefix||'')+'1',date:today(),cust:{name:'Sample customer',phone:'9800000000'},lines:[{name:'Sample medicine',batch:'B12',exp:'2027-06',hsn:'3004',qty:2,rate:100,gst:12,disc:10}],disc:10,total:180,paid:100,recv:100,prevDue:50,prevDep:0,mode:'Cash'};

  $('#prnUsb').onclick=()=>pc('usb');if($('#prnCom'))$('#prnCom').onclick=()=>pc('serial');

  $('#chkU').onclick=async()=>{const m=$('#chkM');m.textContent='Checking…';const v=await checkUpd(true);m.textContent=v===null?'Could not check right now (no internet?).':v!==MYV?'A new version ('+v+') is ready. Tap Update now.':'You have the latest version.'};
  $('#updNow').onclick=doUpdate;
  BIO.supported().then(ok=>{const c=$('#bioCard');if(!c||!ok)return;c.hidden=false;const on=BIO.on('myshop');$('#bioSt').innerHTML=on?'<span class="pill p-grn">On for this device</span>':'<span class="pill p-gry">Off</span>';$('#bioOn').hidden=on;$('#bioOff').hidden=!on});
  $('#bioOn').onclick=async()=>{try{await BIO.enable('myshop','My Shop',PIN);flash('✓ Fingerprint unlock is on. Next time, just touch the sensor.');render()}catch(e){flash(BIO.why(e),1)}};
  $('#bioOff').onclick=async()=>{await BIO.off('myshop');flash('Fingerprint unlock is off. Use your PIN.');render()};

const ASKMODE=new URLSearchParams(location.search).has('ask');
if(ASKMODE){window.askLoad=db=>{DB=Object.assign(blank(),db);STK=null;st.hy=null};window.askQ=q=>shAnswer(q);window.askReady=1}
else storeLoad().then(t=>{SAVED_T=t;viewLock()}).catch(()=>{$('#app').innerHTML=`<div class="lock"><div class="card stack"><div class="logo">₹</div><h2>Could not open your saved data</h2><p class="note" style="margin:0">Your data is safe. The browser did not allow access just now. Close My Shop fully (remove it from recent apps) and open it again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div></div>`});
/* installable app + update button */
if(!ASKMODE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
const MYV=document.querySelector('meta[name=app-version]').content;
async function checkUpd(){if(location.protocol!=='https:'&&location.hostname!=='localhost')return MYV;try{const t=await(await fetch('./?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/name="app-version" content="([^"]+)"/);if(m&&m[1]!==MYV){const b=$('#updBar');b.hidden=false;b.style.display='flex'}return m?m[1]:null}catch(e){return null}}
async function doUpdate(){$$('#updBtn,#updNow').forEach(b=>b.textContent='Updating…');try{await fetch('./',{cache:'reload'});const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('dukaan-bill-')).map(k=>caches.delete(k)));const r=await navigator.serviceWorker?.getRegistration('./');if(r)await r.update()}catch(e){}location.reload()}
$('#updBtn').onclick=doUpdate;setInterval(()=>{if(!document.hidden)checkUpd()},30*60e3);
if(!ASKMODE)checkUpd();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
</script>
