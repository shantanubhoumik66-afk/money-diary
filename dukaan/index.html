/* Fingerprint / face unlock. The PIN still locks the data. Here the PIN is kept sealed on this device
   and is only opened after the phone or laptop confirms your fingerprint, face or screen lock. */
window.BIO=(()=>{
  const te=new TextEncoder(),td=new TextDecoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
  const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const K=app=>'bio.'+app;
  function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bio-keys',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('k',mode);const q=fn(tx.objectStore('k'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})}
  async function deviceKey(app,make){let k=await idbDo('readonly',s=>s.get(app));
    if(!k&&make){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await idbDo('readwrite',s=>s.put(k,app))}
    if(!k)throw new Error('nokey');return k}
  async function prfKey(secret){const base=await crypto.subtle.importKey('raw',secret,'HKDF',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:te.encode('bio-unlock'),info:new Uint8Array()},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
  async function assert(id,salt){const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:ub64(id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000,extensions:salt?{prf:{eval:{first:salt}}}:{}}});
    const r=a.getClientExtensionResults&&a.getClientExtensionResults().prf;return r&&r.results&&r.results.first}
  const api={
    async supported(){try{return !!(window.PublicKeyCredential&&window.isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}},
    on(app){try{return !!JSON.parse(localStorage.getItem(K(app)))}catch(e){return false}},
    async enable(app,label,pin){const salt=rnd(32);
      const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:label},user:{id:rnd(16),name:label+' unlock',displayName:label},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
      const id=b64(c.rawId);const ext=(c.getClientExtensionResults&&c.getClientExtensionResults().prf)||{};
      let secret=ext.results&&ext.results.first;
      if(!secret&&ext.enabled){try{secret=await assert(id,salt)}catch(e){}}
      const key=secret?await prfKey(secret):await deviceKey(app,true);const iv=rnd(12);
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(pin));
      localStorage.setItem(K(app),JSON.stringify({id,salt:b64(salt),iv:b64(iv),ct:b64(ct),mode:secret?'prf':'device'}))},
    async pin(app){const c=JSON.parse(localStorage.getItem(K(app))||'null');if(!c)throw new Error('off');
      const secret=await assert(c.id,c.mode==='prf'?ub64(c.salt):null);
      const key=c.mode==='prf'?(secret?await prfKey(secret):null):await deviceKey(app,false);if(!key)throw new Error('nokey');
      return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(c.iv)},key,ub64(c.ct)))},
    async off(app){localStorage.removeItem(K(app));try{await idbDo('readwrite',s=>s.delete(app))}catch(e){}},
    why(e){const n=e&&e.name;return n==='NotAllowedError'||n==='AbortError'?'Fingerprint was cancelled. Try again or use your PIN.':n==='InvalidStateError'?'This device already has a fingerprint unlock for this app. Turn it off and on again.':'Fingerprint unlock did not work here. Use your PIN.'}
  };
  return api})();

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const r2=x=>Math.round(x*100)/100;
const inr=x=>(x<0?'-':'')+'₹'+Math.abs(r2(x)).toLocaleString('en-IN',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dl=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const expL=s=>s?s.slice(5,7)+'/'+s.slice(2,4):'';
const monthsLeft=e=>{if(!e)return 999;const t=new Date();return(+e.slice(0,4)*12+ +e.slice(5,7))-(t.getFullYear()*12+t.getMonth()+1)};
const phoneWA=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d};
const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',bills:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',stock:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/>',parties:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.4 3.6 5.2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};

const STORE='dukaan.enc.v1',te=new TextEncoder(),td=new TextDecoder();

const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};

  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

async function openWith(pin,txt){const o=JSON.parse(txt);if(o.app!=='dukaan-bill')throw new Error('not ours');const k=await deriveKey(pin,ub64(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct));return{db:JSON.parse(td.decode(pt)),key:k,salt:ub64(o.salt)}}

const newLink=()=>({key:b64(crypto.getRandomValues(new Uint8Array(32))),t:Date.now()});
const blank=()=>({v:2,shop:{name:'',addr:'',phone:'',gstin:'',mode:'pharmacy',prefix:'INV-',taxIncl:true,upi:'',footer:'Thank you! Please visit again.',dl:'',t:0},items:[],bills:[],custs:[],pays:[],sups:[],spays:[],ins:[],del:{},seq:1,link:newLink()});
function upgrade(db){const now=Date.now();
  for(const k of['items','bills','custs','pays','sups','spays','ins'])db[k]=db[k]||[];if(!db.shop.linkFrom)db.shop.linkFrom=nextYM();db.del=db.del||{};if(!db.link)db.link=newLink();
  if((db.v||1)<2){const sold={};for(const b of db.bills)for(const l of b.lines){const k=l.itemId+'|'+l.batchId;sold[k]=(sold[k]||0)+l.qty}
    for(const it of db.items){it.t=it.t||now;for(const bt of it.batches){const q=r2((+bt.qty||0)+(sold[it.id+'|'+bt.id]||0));if(q)db.ins.push({id:uid(),item:it.id,batch:bt.id,qty:q,date:today(),note:'Opening stock',t:now});delete bt.qty}}
    for(const x of[...db.custs,...db.pays,...db.bills])x.t=x.t||now;db.shop.t=db.shop.t||now;db.v=2}

/* stock is counted from stock entries minus bills, so two devices never overwrite each other's numbers */

function nettByMonth(){const M={};const g=ym=>M[ym]||(M[ym]={sales:0,party:0,due:0,nett:0});

function searchItems(q){q=q.trim().toLowerCase();if(!q)return[];return DB.items.filter(i=>i.name.toLowerCase().includes(q)||(i.salt||'').toLowerCase().includes(q)).sort((a,b)=>a.name.toLowerCase().indexOf(q)-b.name.toLowerCase().indexOf(q)||a.name.localeCompare(b.name)).slice(0,12)}

function addLine(it){const D=st.draft;const ex=D.lines.find(l=>l.itemId===it.id);

function drawLines(){const D=st.draft,ph=isPh(),el=$('#lines');

   return`<div class="bl" data-i="${i}"><div class="top"><b>${esc(l.name)}</b><span style="font-weight:800">${inr(c.amt)}</span><button type="button" class="x" data-del="${i}" aria-label="Remove ${esc(l.name)}">✕</button></div>

   <div class="nums"><label>Qty<input class="in" data-k="qty" inputmode="decimal" value="${l.qty}"></label><label>Rate ₹<input class="in" data-k="rate" inputmode="decimal" value="${l.rate}"></label>
   <label>Disc %<input class="in" data-k="disc" inputmode="decimal" value="${l.disc||''}" placeholder="0"></label><label>GST %<select class="in" data-k="gst">${[0,5,12,18,28].map(g=>`<option ${g==l.gst?'selected':''}>${g}</option>`).join('')}</select></label></div>
   ${warn?`<span class="pill p-amb">Only ${left} in stock</span>`:''}${ph&&l.exp&&m<0?' <span class="pill p-red">This batch is expired</span>':''}</div>`}).join('');

async function saveBill(){const D=st.draft,L=cleanLines(),t=billCalc(L),bm=$('#bm');if(!L.length)return;

   <div class="grid g2"><label class="f">Phone<input class="in" id="s_phone" inputmode="tel" value="${esc(S.phone)}"></label><label class="f">GSTIN<input class="in" id="s_gstin" value="${esc(S.gstin)}" style="text-transform:uppercase"></label>
   <label class="f">Drug licence no. (pharmacy)<input class="in" id="s_dl" value="${esc(S.dl||'')}"></label><label class="f">UPI ID (for payment requests)<input class="in" id="s_upi" value="${esc(S.upi)}" placeholder="name@okaxis"></label>
   <label class="f">Bill number prefix<input class="in" id="s_prefix" value="${esc(S.prefix)}"></label><label class="f">Next bill number<input class="in" id="s_seq" inputmode="numeric" value="${DB.seq}"></label></div>
   <label class="f">Shop type<select class="in" id="s_mode"><option value="pharmacy" ${ph?'selected':''}>Pharmacy (batch no., expiry, salt search)</option><option value="general" ${ph?'':'selected'}>General shop</option></select></label>
   <label class="f">Prices I type are<select class="in" id="s_tax"><option value="1" ${S.taxIncl?'selected':''}>Including GST (like MRP)</option><option value="0" ${S.taxIncl?'':'selected'}>Before GST (GST added on top)</option></select></label>
   <label class="f">Message at the bottom of bills<input class="in" id="s_footer" value="${esc(S.footer)}"></label><button class="btn pri">Save shop details</button></form>
   <div class="stack"><section class="card stack"><h3>Backup</h3><p class="note" style="margin:0">Your data lives only on this device. Download a backup file regularly and keep it in Google Drive. The file is locked with your current PIN.</p>
    <button class="btn pri" id="bk">Download backup file</button><label class="btn" for="rf">Restore from backup file</label><input type="file" id="rf" accept=".dukaan,.json" hidden>
    <div class="row"><button class="btn" id="cs1">Sales report (Excel CSV)</button><button class="btn" id="cs2">Stock list (Excel CSV)</button></div></section>
   <section class="card stack"><h3>Sync phone &amp; laptop + Money Diary link</h3>
    ${syncOn()?`<p id="syncStatus" style="margin:0"></p>${syncSt.needPin?`<label class="f">PIN used on your other device<input class="in" id="npin" type="password" inputmode="numeric"></label><button class="btn pri" id="npinB">Use this PIN</button>`:''}
     <p class="note" style="margin:0">Your bills, stock and parties sync automatically. Each month's nett goes to Money Diary as the Business amount (open Money Diary once on this device to link it).</p>
     <div class="row"><label class="f sp">Send nett to Money Diary from<input class="in" type="month" id="lfrom" value="${esc(DB.shop.linkFrom||'')}"></label></div>
     <p class="note" style="margin:0">Months before this keep the Business amount from your Excel file.</p>
     <div class="row"><button class="btn" id="syncB">Sync now</button><button class="btn" id="tokB">Change token</button><button class="btn red" id="offB">Turn off sync</button></div>`
    :`<p class="note" style="margin:0">Paste the <b>same GitHub sync token you use in Money Diary</b> (its Tokens tab). Use the <b>same PIN</b> on your phone and laptop. Data is encrypted with your PIN before it leaves this device.</p>`}
    <div id="tokRow" class="stack" ${syncOn()?'hidden':''}><label class="f">GitHub token<input class="in" id="tok" type="password" autocomplete="off" placeholder="ghp_… or github_pat_…"></label><button class="btn pri" id="conB">Connect and sync</button></div><p id="sm" class="note" style="margin:0"></p></section>
   <section class="card stack" id="bioCard" hidden><h3>Fingerprint / face unlock</h3><p class="note" style="margin:0">Open the app with your fingerprint instead of typing the PIN. Your PIN still works and still protects the data. Turn this on separately on your phone and on your laptop.</p><p id="bioSt" style="margin:0"></p><button class="btn pri" id="bioOn">Turn on fingerprint unlock</button><button class="btn red" id="bioOff">Turn off fingerprint unlock</button></section>
   <section class="card stack"><h3>App version &amp; update</h3><p style="margin:0">You are using version <b>${esc(MYV)}</b>.</p>
    <div class="row"><button class="btn" id="chkU">Check for updates</button><button class="btn pri" id="updNow">Update now</button></div><p id="chkM" class="note" style="margin:0"></p></section>
   <section class="card stack"><h3>PIN and security</h3><div class="grid g2"><label class="f">Current PIN<input class="in" id="op" type="password" inputmode="numeric"></label><label class="f">New PIN<input class="in" id="np" type="password" inputmode="numeric"></label></div>
    <button class="btn" id="chp">Change PIN</button><button class="btn" id="lk">Lock now</button><button class="btn red" id="wipe">Erase all data on this device</button>
    <p class="note" style="margin:0">The app locks itself after 10 minutes without use. Data is encrypted with AES-256 using your PIN.</p></section></div></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const v=k=>$('#s_'+k).value.trim();Object.assign(S,{name:v('name'),addr:v('addr'),phone:v('phone'),gstin:v('gstin').toUpperCase(),dl:v('dl'),upi:v('upi'),prefix:v('prefix'),mode:v('mode'),taxIncl:v('tax')==='1',footer:v('footer')});
    const sq=parseInt(v('seq'));if(sq>0)DB.seq=sq;S.t=Date.now();await persist();render();flash('✓ Shop details saved.')};
  $('#bk').onclick=async()=>{download('MyShop-backup-'+today()+'.dukaan',await sealWith(KEYOBJ,SALT,DB),'application/json');flash('✓ Backup downloaded. Save it to Google Drive. You need your current PIN to restore it.')};
  $('#rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const pin=prompt('Type the PIN that was used when this backup was made');if(!pin)return;
    try{const o=await openWith(pin.trim(),await f.text());const keep=DB.sync;DB=upgrade(o.db);if(keep)DB.sync=keep;await persist();render();flash('✓ Backup restored: '+DB.bills.length+' bills, '+DB.items.length+' items.')}catch(err){flash('Could not open this file. Check the PIN and that it is a My Shop backup.',1)}e.target.value=''};
  $('#cs1').onclick=()=>{const rows=[['Bill no','Date','Customer','Mobile','Item','Batch','Expiry','HSN','Qty','Rate','Disc %','GST %','Taxable','GST','Amount','Bill total','Paid','Mode']];
    for(const b of[...DB.bills].sort((a,c)=>a.n-c.n))for(const l of b.lines){const c=lineCalc(l);rows.push([b.no,dl(b.date),b.cust?.name||'',b.cust?.phone||'',l.name,l.batch||'',expL(l.exp),l.hsn||'',l.qty,l.rate,l.disc||0,l.gst,r2(c.taxable),r2(c.tax),r2(c.amt),b.total,b.paid,modeL(b.mode)])}
    download('Sales-'+today()+'.csv',csv(rows),'text/csv')};
  $('#cs2').onclick=()=>{const rows=[['Item','Salt','Unit','Price','GST %','HSN','Rack','Batch','Expiry','Qty']];for(const i of DB.items)for(const b of(i.batches.length?i.batches:[{}]))rows.push([i.name,i.salt||'',i.unit||'',i.price,i.gst,i.hsn||'',i.rack||'',b.b||'',expL(b.exp),b.id?qB(i,b):0]);download('Stock-'+today()+'.csv',csv(rows),'text/csv')};
  $('#chp').onclick=async()=>{const o=$('#op').value.trim(),n=$('#np').value.trim();if(o!==PIN){flash('Current PIN is wrong.',1);return}if(!/^\d{4,12}$/.test(n)){flash('New PIN must be 4 to 12 digits.',1);return}if(syncOn())await syncNow();clearTimeout(syncTimer);await setPin(n,true);if(syncOn())await syncNow();if(BIO.on('myshop')){try{await BIO.enable('myshop','My Shop',n)}catch(e){await BIO.off('myshop')}}$('#op').value=$('#np').value='';flash('✓ PIN changed. Download a new backup file, because old backups still use the old PIN.')};
  $('#lk').onclick=lockNow;showSync();
  $('#chkU').onclick=async()=>{const m=$('#chkM');m.textContent='Checking…';const v=await checkUpd(true);m.textContent=v===null?'Could not check right now (no internet?).':v!==MYV?'A new version ('+v+') is ready. Tap Update now.':'You have the latest version.'};
  $('#updNow').onclick=doUpdate;
  BIO.supported().then(ok=>{const c=$('#bioCard');if(!c||!ok)return;c.hidden=false;const on=BIO.on('myshop');$('#bioSt').innerHTML=on?'<span class="pill p-grn">On for this device</span>':'<span class="pill p-gry">Off</span>';$('#bioOn').hidden=on;$('#bioOff').hidden=!on});
  $('#bioOn').onclick=async()=>{try{await BIO.enable('myshop','My Shop',PIN);flash('✓ Fingerprint unlock is on. Next time, just touch the sensor.');render()}catch(e){flash(BIO.why(e),1)}};
  $('#bioOff').onclick=async()=>{await BIO.off('myshop');flash('Fingerprint unlock is off. Use your PIN.');render()};
  const sm=$('#sm');const busy=async(fn,ok)=>{sm.className='note';sm.textContent='Working…';try{await fn();sm.className='grn';sm.textContent=ok;render()}catch(e){sm.className='red';sm.textContent=e.message==='offline'?'No internet connection.':e.message}};
  $('#conB').onclick=()=>busy(()=>connectSync($('#tok').value),'✓ Connected. Your data is syncing.');
  if($('#syncB'))$('#syncB').onclick=()=>syncNow();
  if($('#lfrom'))$('#lfrom').onchange=async e=>{if(!e.target.value)return;S.linkFrom=e.target.value;S.t=Date.now();await persist();flash('✓ Nett goes to Money Diary from '+ymL(S.linkFrom)+'.')};
  if($('#tokB'))$('#tokB').onclick=()=>{$('#tokRow').hidden=false;$('#tok').focus()};
  if($('#offB'))twoTap($('#offB'),'Tap again to turn off',async()=>{DB.sync=null;syncSt.state='off';await persist(true);render();flash('Sync is off on this device. Your data stays here.')});
  if($('#npinB'))$('#npinB').onclick=()=>busy(()=>enterNewPin($('#npin').value.trim()),'✓ PIN updated. Syncing again.');
  twoTap($('#wipe'),'Tap again: erase everything',()=>{localStorage.removeItem(STORE);lockNow()})}

viewLock();
/* installable app + update button */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
const MYV=document.querySelector('meta[name=app-version]').content;
async function checkUpd(){if(location.protocol!=='https:'&&location.hostname!=='localhost')return MYV;try{const t=await(await fetch('./?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/name="app-version" content="([^"]+)"/);if(m&&m[1]!==MYV){const b=$('#updBar');b.hidden=false;b.style.display='flex'}return m?m[1]:null}catch(e){return null}}
async function doUpdate(){$$('#updBtn,#updNow').forEach(b=>b.textContent='Updating…');try{await fetch('./',{cache:'reload'});const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('dukaan-bill-')).map(k=>caches.delete(k)));const r=await navigator.serviceWorker?.getRegistration('./');if(r)await r.update()}catch(e){}location.reload()}
$('#updBtn').onclick=doUpdate;setInterval(()=>{if(!document.hidden)checkUpd()},30*60e3);
checkUpd();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
</script>
</body>
</html>
